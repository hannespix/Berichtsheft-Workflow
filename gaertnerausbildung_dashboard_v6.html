}

function TimelineErweitert({ config, k }) {
  const start = k.start, ende = k.ende, heute = k.heute;
  const pctAt = d => Math.max(0, Math.min(100, ((d.getTime() - start.getTime()) / (ende.getTime() - start.getTime())) * 100));
  const heutePct = pctAt(heute);

  return (
    <section className="paper p-6 sm:p-8 fade-up" style={{ animationDelay: "0.15s" }}>
      <div className="flex items-center justify-between mb-2">
        <h2 className="font-display text-xl" style={{ fontWeight: 600 }}>Zeitstrahl</h2>
        <div className="text-xs text-[#6b6b6b] font-mono">{fmtDE(start)} – {fmtDE(ende)}</div>
      </div>

      <div className="relative pt-16 pb-14">
        <div className="absolute left-0 right-0 top-1/2 h-8 -translate-y-1/2 flex">
          {[0, 1, 2].map(i => (
            <div key={i} className="h-full relative" style={{ width: `${100/3}%` }}>
              <div className="absolute inset-y-0 left-0 right-1" style={{
                background: i === 0 ? "#f0f4ea" : i === 1 ? "#ebf0e2" : "#e5ebdb",
                borderRadius: "2px",
              }} />
              <div className="absolute inset-0 flex items-center justify-center text-[10px] font-medium uppercase tracking-widest"
                style={{ color: k.aktLehrjahr === i + 1 ? "#2d5a3d" : "#9aa89a" }}>
                {i + 1}. LJ
              </div>
            </div>
          ))}
        </div>

        <div className="absolute left-0 right-0 top-1/2 h-1 mt-[14px] -translate-y-1/2">
          <div className="h-1 rounded-full" style={{ background: "#2d5a3d", width: `${heutePct}%` }} />
        </div>

        <MS pct={0} top label="Start" sub={fmtDE(start)} kind="filled" />
        <MS pct={pctAt(k.zpDate)} bottom label={`ZP${!k.zpManuell ? " ~" : ""}`} sub={`${DE_MONTHS_SHORT[k.zpDate.getMonth()]} ${k.zpDate.getFullYear()}`} kind="mid" icon={GraduationCap} />
        <MS pct={pctAt(k.apDate)} top label={`AP${!k.apManuell ? " ~" : ""}`} sub={`${DE_MONTHS_SHORT[k.apDate.getMonth()]} ${k.apDate.getFullYear()}`} kind="mid" icon={Target} />
        <MS pct={100} bottom label="Ende" sub={fmtDE(ende)} kind="outline" />

        <div className="absolute" style={{ left: `${heutePct}%`, top: "50%" }}>
          <div className="-translate-x-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-white animate-pulse"
            style={{ border: "3px solid #2d5a3d", boxShadow: "0 0 0 4px rgba(45,90,61,0.12)" }} />
        </div>
      </div>

      <div className="mt-2 pt-4 border-t text-xs text-[#6b6b6b] space-y-1" style={{ borderColor: "#e5e0d4" }}>
        {(!k.zpManuell || !k.apManuell) && (
          <div className="flex items-center gap-1.5">
            <span className="inline-block w-1.5 h-1.5 rounded-full" style={{ background: "#c9a23a" }} />
            <span>~ = automatisch aus Verlauf berechnet · kann in den Einstellungen überschrieben werden</span>
          </div>
        )}
        {k.fruehPruef && (
          <div>
            Frühester Prüfungstermin (§ 43 BBiG): <span className="font-mono text-[#1a1a1a]">{fmtDE(k.fruehPruef)}</span>
            {config.vorzeitige_zulassung
              ? <> &nbsp;· Vorzeitige Zulassung (§ 45 BBiG) aktiv: <span className="font-mono text-[#2d5a3d]">{fmtDE(k.fruehPruefVorzeitig)}</span></>
              : <> &nbsp;· Bei vorzeitiger Zulassung (§ 45 BBiG): <span className="font-mono text-[#1a1a1a]">{fmtDE(k.fruehPruefVorzeitig)}</span></>
            }
          </div>
        )}
      </div>
    </section>
  );
}

function MS({ pct, top, bottom, label, sub, kind, icon: Icon }) {
  const style = {
    filled:  { background: "#2d5a3d", border: "3px solid #2d5a3d" },
    mid:     { background: "#fff",    border: "3px solid #2d5a3d" },
    outline: { background: "#fff",    border: "3px solid #9aa89a" },
  }[kind];
  return (
    <div className="absolute" style={{ left: `${pct}%`, top: "50%" }}>
      <div className="-translate-x-1/2 -translate-y-1/2 w-4 h-4 rounded-full relative z-10" style={style} />
      <div className={`-translate-x-1/2 absolute left-0 ${top ? "bottom-8" : "top-8"} text-center whitespace-nowrap`}>
        <div className="flex items-center gap-1 justify-center">
          {Icon && <Icon size={13} style={{ color: "#2d5a3d" }} />}
          <span className="text-xs font-medium">{label}</span>
        </div>
        <div className="text-[10px] text-[#6b6b6b] font-mono mt-0.5">{sub}</div>
      </div>
    </div>
  );
}

function GaugeCard({ titel, verbraucht, maximum, einheit, farbe, warnAb = 0.85, kritischAb = 1.0, subtitel, icon: Icon, invertiert }) {
  const pct = maximum > 0 ? verbraucht / maximum : 0;
  const pctDisplay = Math.min(pct, 1);
  const isWarn = pct >= warnAb;
  const isKrit = pct >= kritischAb;
  const activeColor = invertiert
    ? (isKrit ? "#b04545" : isWarn ? "#c9a23a" : "#2e7d5a")
    : (farbe || "#2d5a3d");
  const rest = Math.max(0, maximum - verbraucht);
  const R = 42, C = 2 * Math.PI * R;
  const dash = pctDisplay * C;

  return (
    <div className="paper p-5 fade-up">
      <div className="flex items-start justify-between mb-2">
        <div className="text-xs uppercase tracking-widest text-[#6b6b6b]">{titel}</div>
        {Icon && <Icon size={16} style={{ color: activeColor }} />}
      </div>
      <div className="flex items-center gap-4">
        <div className="relative w-[110px] h-[110px] flex-shrink-0">
          <svg viewBox="0 0 100 100" className="w-full h-full -rotate-90">
            <circle cx="50" cy="50" r={R} fill="none" stroke="#e5e0d4" strokeWidth="8" />
            <circle cx="50" cy="50" r={R} fill="none" stroke={activeColor} strokeWidth="8" strokeLinecap="round"
              strokeDasharray={`${dash} ${C}`} style={{ transition: "stroke-dasharray 0.8s ease-out, stroke 0.3s" }} />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            <div className="font-display text-2xl leading-none" style={{ fontWeight: 600, color: activeColor }}>{verbraucht}</div>
            <div className="text-[10px] text-[#6b6b6b] font-mono">von {maximum}</div>
          </div>
        </div>
        <div className="flex-1 min-w-0">
          <div className="text-sm font-medium">{Math.round(pct * 100)}%</div>
          <div className="text-xs mt-0.5" style={{ color: (isWarn || isKrit) && invertiert ? activeColor : "#6b6b6b" }}>
            {invertiert && isKrit ? "Einzelfallprüfung" : `${rest} ${einheit} übrig`}
          </div>
          {subtitel && <div className="text-[11px] text-[#6b6b6b] mt-1.5 pt-1.5 border-t" style={{ borderColor: "#efece2" }}>{subtitel}</div>}
        </div>
      </div>
    </div>
  );
}

function RisikoRadar({ k, berichte }) {
  const wochenVorbei = Math.max(1, Math.floor(k.kTageVorbei / 7));
  const berichtScore = Math.min(1, berichte.length / wochenVorbei);
  const metrics = [
    { label: "Fehltage", wert: k.krank, max: k.fehltageSoft,
      pct: k.fehltageSoft > 0 ? k.krank / k.fehltageSoft : 0, invertiert: true,
      hinweis: k.krank >= k.fehltageSoft ? "10 %-Grenze erreicht" : k.krank >= k.fehltageSoft * 0.6 ? "Vorsicht" : "Im grünen Bereich" },
    { label: "Urlaub", wert: k.urlaubGenommen, max: k.urlaubGesamt,
      pct: k.urlaubGesamt > 0 ? k.urlaubGenommen / k.urlaubGesamt : 0,
      hinweis: k.urlaubGenommen >= k.urlaubGesamt ? "Aufgebraucht" : `${k.urlaubGesamt - k.urlaubGenommen} Tage verfügbar` },
    { label: "Berichte", wert: berichte.length, max: wochenVorbei,
      pct: berichtScore, gutWennVoll: true,
      hinweis: berichtScore < 0.5 ? "Rückstand" : berichtScore < 0.9 ? "Ein paar fehlen" : "Aktuell" },
    { label: "Zeit", wert: k.kTageVorbei, max: k.kTageGes, pct: k.progress / 100,
      hinweis: `${k.progress}% absolviert` },
  ];

  return (
    <section className="paper p-6 sm:p-8 fade-up">
      <div className="flex items-center justify-between mb-5">
        <h2 className="font-display text-xl" style={{ fontWeight: 600 }}>Problemzonen & Grenzen</h2>
        <div className="flex items-center gap-1 text-xs text-[#6b6b6b]"><TrendingUp size={13} /> Ampel</div>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        {metrics.map((m, i) => {
          let stufe;
          if (m.gutWennVoll) stufe = m.pct >= 0.9 ? "gruen" : m.pct >= 0.5 ? "gelb" : "rot";
          else if (m.invertiert) stufe = m.pct >= 1.0 ? "rot" : m.pct >= 0.6 ? "gelb" : "gruen";
          else stufe = m.pct >= 1.0 ? "rot" : m.pct >= 0.85 ? "gelb" : "gruen";
          const ampel = { gruen: "#2e7d5a", gelb: "#c9a23a", rot: "#b04545" }[stufe];
          return (
            <div key={i} className="rounded-sm p-3.5" style={{ background: "#fcfaf3", border: "1px solid #e5e0d4" }}>
              <div className="flex items-center justify-between mb-2">
                <div className="text-xs uppercase tracking-widest text-[#6b6b6b]">{m.label}</div>
                <div className="w-2 h-2 rounded-full" style={{ background: ampel, boxShadow: `0 0 0 3px ${ampel}20` }} />
              </div>
              <div className="font-display text-xl mb-1" style={{ fontWeight: 600 }}>
                {m.wert}<span className="text-sm text-[#9a9a9a] font-sans font-normal"> / {m.max}</span>
              </div>
              <div className="h-1 rounded-full overflow-hidden mb-2" style={{ background: "#e5e0d4" }}>
                <div className="h-full" style={{ width: `${Math.min(100, m.pct * 100)}%`, background: ampel }} />
              </div>
              <div className="text-[11px]" style={{ color: ampel }}>{m.hinweis}</div>
            </div>
          );
        })}
      </div>
    </section>
  );
}

function Heatmap({ tage, k }) {
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const weeks = 26;
  const anfang = new Date(heute); anfang.setDate(anfang.getDate() - weeks * 7);
  const offset = (anfang.getDay() + 6) % 7;
  anfang.setDate(anfang.getDate() - offset);

  const cols = [];
  let cur = new Date(anfang);
  for (let w = 0; w < weeks + 1; w++) {
    const days = [];
    for (let d = 0; d < 7; d++) {
      const iso = fmtISO(cur);
      const entry = tage[iso];
      days.push({ iso, d: cur.getDate(), m: cur.getMonth(), status: entry?.status,
        inFuture: cur > heute, inPast: cur < k.start });
      cur = new Date(cur); cur.setDate(cur.getDate() + 1);
    }
    cols.push(days);
  }
  const monthLabels = [];
  let lastM = -1;
  cols.forEach((col, i) => { const m = col[0].m; if (m !== lastM) { monthLabels.push({ i, m }); lastM = m; } });

  return (
    <section className="paper p-6 sm:p-8 fade-up">
      <div className="flex items-center justify-between mb-5 flex-wrap gap-2">
        <div>
          <h2 className="font-display text-xl" style={{ fontWeight: 600 }}>Aktivität</h2>
          <p className="text-xs text-[#6b6b6b] mt-0.5">Letzte 26 Wochen · jedes Quadrat = ein Tag</p>
        </div>
        <div className="flex items-center gap-3 text-xs text-[#6b6b6b]">
          <span>weniger</span>
          {["#f0ece0", "#c8d6b4", "#8caf78", "#4a6b3a", "#2d5a3d"].map((c, i) => (
            <div key={i} className="w-3 h-3 rounded-sm" style={{ background: c }} />
          ))}
          <span>mehr</span>
        </div>
      </div>
      <div className="overflow-x-auto">
        <div style={{ minWidth: "fit-content" }}>
          <div className="flex gap-[3px] mb-1 pl-8">
            {cols.map((_, i) => {
              const lab = monthLabels.find(l => l.i === i);
              return <div key={i} className="w-[12px] text-[10px] text-[#6b6b6b] font-mono">{lab ? DE_MONTHS_SHORT[lab.m] : ""}</div>;
            })}
          </div>
          <div className="flex gap-[3px]">
            <div className="flex flex-col gap-[3px] mr-1 pt-[1px]">
              {DE_WD.map((wd, i) => (
                <div key={i} className="w-6 h-[12px] text-[9px] text-[#9a9a9a] font-mono leading-[12px]">{i % 2 === 0 ? wd : ""}</div>
              ))}
            </div>
            {cols.map((col, ci) => (
              <div key={ci} className="flex flex-col gap-[3px]">
                {col.map((day, di) => {
                  let bg = "#f0ece0"; let opacity = 1;
                  if (day.inFuture) { bg = "#f7f4ec"; opacity = 0.4; }
                  else if (day.inPast) { bg = "#f7f4ec"; opacity = 0.3; }
                  else if (day.status) bg = STATUS[day.status]?.heat || "#f0ece0";
                  return <div key={di} className="w-[12px] h-[12px] rounded-[2px]" style={{ background: bg, opacity }}
                    title={`${day.iso}${day.status ? ` · ${STATUS[day.status]?.label}` : ""}`} />;
                })}
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

function Kalender({ config, tage, berichteByDatum, saveTag, deleteTag, pendingNav, clearPendingNav, onOpenBericht }) {
  const [cursor, setCursor] = useState(new Date());
  const [selected, setSelected] = useState(null);

  // Cross-Navigation: Berichtsheft → Kalender
  useEffect(() => {
    if (pendingNav?.target === "kalender" && pendingNav.datum) {
      setCursor(parseISO(pendingNav.datum));
      setSelected(pendingNav.datum);
      clearPendingNav();
    }
  }, [pendingNav]);

  const startMonth = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const startDay = (startMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(cursor.getFullYear(), cursor.getMonth(), d));
  while (cells.length % 7 !== 0) cells.push(null);

  const stdStunden = +(config.vollzeit_wochenstunden * (config.teilzeit_prozent / 100) / 5).toFixed(2);

  return (
    <div className="py-6 sm:py-8 space-y-6">
      <div className="paper p-6">
        <div className="flex items-center justify-between mb-5">
          <h2 className="font-display text-xl" style={{ fontWeight: 600 }}>{DE_MONTHS[cursor.getMonth()]} {cursor.getFullYear()}</h2>
          <div className="flex gap-1">
            <button className="btn-ghost p-2" onClick={() => setCursor(addMonths(cursor, -1))}><ChevronLeft size={16} /></button>
            <button className="btn-ghost px-3 py-2 text-xs" onClick={() => setCursor(new Date())}>Heute</button>
            <button className="btn-ghost p-2" onClick={() => setCursor(addMonths(cursor, 1))}><ChevronRight size={16} /></button>
          </div>
        </div>
        <div className="grid grid-cols-7 gap-1 mb-2">
          {DE_WD.map(d => <div key={d} className="text-xs uppercase tracking-widest text-[#6b6b6b] text-center py-1.5">{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((d, i) => {
            if (!d) return <div key={i} />;
            const iso = fmtISO(d), entry = tage[iso];
            const hasBericht = !!berichteByDatum[iso];
            const isWE = d.getDay() === 0 || d.getDay() === 6;
            const isToday = iso === fmtISO(new Date());
            const st = entry ? STATUS[entry.status] : null;
            return (
              <button key={i} onClick={() => setSelected(iso)}
                className="aspect-square rounded-sm p-1.5 sm:p-2 text-left relative"
                style={{ background: st?.bg || (isWE ? "#efece2" : "#fff"), border: isToday ? "2px solid #2d5a3d" : "1px solid #e5e0d4" }}>
                <div className="text-xs font-mono font-medium" style={{ color: st?.color || "#6b6b6b" }}>{d.getDate()}</div>
                {st && <div className="text-[10px] mt-0.5 leading-tight truncate" style={{ color: st.color }}>{st.label}</div>}
                {hasBericht && (
                  <div className="absolute bottom-1 right-1 p-0.5 rounded-sm" style={{ background: "#2d5a3d" }} title="Tagesbericht vorhanden">
                    <NotebookPen size={9} style={{ color: "#f7f4ec" }} />
                  </div>
                )}
              </button>
            );
          })}
        </div>
        <div className="flex flex-wrap gap-3 mt-5 pt-4 border-t text-xs" style={{ borderColor: "#e5e0d4" }}>
          {Object.entries(STATUS).map(([k, s]) => (
            <div key={k} className="flex items-center gap-1.5">
              <div className="w-3 h-3 rounded-sm" style={{ background: s.bg, border: `1px solid ${s.color}` }} />
              <span className="text-[#6b6b6b]">{s.label}</span>
            </div>
          ))}
          <div className="flex items-center gap-1.5 ml-2 pl-3 border-l" style={{ borderColor: "#e5e0d4" }}>
            <div className="p-0.5 rounded-sm" style={{ background: "#2d5a3d" }}>
              <NotebookPen size={9} style={{ color: "#f7f4ec" }} />
            </div>
            <span className="text-[#6b6b6b]">= Bericht vorhanden</span>
          </div>
        </div>
      </div>
      {selected && <TagDialog
        datum={selected} entry={tage[selected]} bericht={berichteByDatum[selected]}
        onClose={() => setSelected(null)}
        onSave={d => { saveTag(selected, d); setSelected(null); }}
        onDelete={() => { deleteTag(selected); setSelected(null); }}
        onOpenBericht={() => { const d = selected; setSelected(null); onOpenBericht(d); }}
        stdStunden={stdStunden} />}
    </div>
  );
}

            <div className="text-xs uppercase tracking-widest text-[#6b6b6b]">Tag erfassen</div>

          <button onClick={onClose} className="p-1 hover:bg-[#f0ece0] rounded-sm"><X size={18} /></button>

                style={{
                  background: status === k ? s.bg : "#fff",

                  color: status === k ? s.color : "#1a1a1a", fontWeight: status === k ? 500 : 400,
                }}>{s.label}</button>

        {["anwesend", "berufsschule", "lerntag", "ueba"].includes(status) && (

        {/* Verknüpfung zum Berichtsheft */}
        <div className="mt-4 pt-4 border-t" style={{ borderColor: "#e5e0d4" }}>

        <div className="flex gap-2 justify-between mt-4">
          {entry ? (
            <button onClick={onDelete} className="btn-ghost" style={{ color: "#b04545", borderColor: "#e8c0c0" }}>
              <Trash2 size={14} className="inline mr-1" />Löschen
            </button>

            <button onClick={onClose} className="btn-ghost">Abbrechen</button>

function Berichte({ config, berichte, tage, saveBericht, deleteBericht, pendingNav, clearPendingNav, onOpenTag }) {
  const [editing, setEditing] = useState(null);
  const [printWeek, setPrintWeek] = useState(null);
  const [lightbox, setLightbox] = useState(null);

  // Cross-Navigation: Kalender → Berichtsheft
  useEffect(() => {
    if (pendingNav?.target === "berichte" && pendingNav.datum) {
      const existing = berichte.find(b => b.datum === pendingNav.datum);
      if (existing) setEditing(existing);
      else setEditing({
        datum: pendingNav.datum, titel: "", taetigkeiten: "", lerninhalte: "",
        unterweisung: "", wetter: null, temperatur: "", temp_min: "", temp_max: "", niederschlag: "", ort: "", personen: "",
        werkzeuge: "", besonderheiten: "", stundenvon: "", stundenbis: "", bilder: [],
      });
      clearPendingNav();
    }
  }, [pendingNav]);

  // Gruppiere Berichte nach KW
  const nachKW = useMemo(() => {
    const m = new Map();
    berichte.forEach(b => {
      const d = parseISO(b.datum);
      const key = `${d.getFullYear()}-KW${String(getKW(d)).padStart(2, "0")}`;
      if (!m.has(key)) m.set(key, { key, jahr: d.getFullYear(), kw: getKW(d), berichte: [] });
      m.get(key).berichte.push(b);
    });
    return [...m.values()].sort((a, b) => b.key.localeCompare(a.key));
  }, [berichte]);

  return (
    <div className="py-6 sm:py-8 space-y-6">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h2 className="font-display text-2xl" style={{ fontWeight: 600 }}>Berichtsheft</h2>
          <p className="text-sm text-[#6b6b6b] mt-1">Ausbildungsnachweis · Wochenweise nach KW gruppiert</p>
        </div>
        <button className="btn-primary flex items-center gap-2"
          onClick={() => setEditing({
            datum: fmtISO(new Date()), titel: "", taetigkeiten: "", lerninhalte: "",
            unterweisung: "", wetter: null, temperatur: "", temp_min: "", temp_max: "", niederschlag: "", ort: "", personen: "",
            werkzeuge: "", besonderheiten: "", stundenvon: "", stundenbis: "", bilder: [],
          })}>
          <Plus size={16} /> Neuer Bericht
        </button>
      </div>

      {nachKW.length === 0 ? (
        <div className="paper p-10 text-center">
          <NotebookPen className="mx-auto mb-3 text-[#9aa89a]" size={32} />
          <p className="text-[#6b6b6b]">Noch keine Tagesberichte erfasst.</p>
        </div>
      ) : (
        <div className="space-y-4">
          {nachKW.map(grp => (
            <WocheGruppe key={grp.key} grp={grp} onEdit={b => setEditing(b)}
              onDelete={deleteBericht} onLightbox={setLightbox}
              onPrintWeek={() => setPrintWeek(grp)} />
          ))}
        </div>
      )}

      {editing && <BerichtDialog bericht={editing} config={config} tag={tage[editing.datum]}
        onClose={() => setEditing(null)}
        onOpenTag={() => { const d = editing.datum; setEditing(null); onOpenTag(d); }}
        onSave={b => { saveBericht(b); setEditing(null); }} />}

      {printWeek && <PrintWoche config={config} grp={printWeek} onClose={() => setPrintWeek(null)} />}
      {lightbox && <Lightbox bildId={lightbox} onClose={() => setLightbox(null)} />}
    </div>
  );
}

function WocheGruppe({ grp, onEdit, onDelete, onLightbox, onPrintWeek }) {
  const montag = mondayOfKW(grp.jahr, grp.kw);
  const sonntag = new Date(montag); sonntag.setDate(montag.getDate() + 6);
  return (
    <div className="paper p-5">
      <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
        <div>
          <div className="text-xs uppercase tracking-widest text-[#6b6b6b] font-mono">KW {grp.kw} · {grp.jahr}</div>
          <div className="font-display text-lg" style={{ fontWeight: 600 }}>
            {montag.toLocaleDateString("de-DE", { day: "2-digit", month: "short" })} – {sonntag.toLocaleDateString("de-DE", { day: "2-digit", month: "short", year: "numeric" })}
          </div>
        </div>
        <button className="btn-ghost flex items-center gap-2" onClick={onPrintWeek}>
          <Printer size={14} /> Woche als PDF
        </button>
      </div>

// Wetter-Code-Mapping (Open-Meteo WMO-Codes)
function wetterInfo(code) {
  if (code == null) return null;
  if (code === 0) return { label: "Klar", icon: Sun, color: "#c9a23a" };
  if (code === 1) return { label: "Heiter", icon: Sun, color: "#c9a23a" };
  if (code === 2) return { label: "Teils bewölkt", icon: Cloud, color: "#6088a3" };
  if (code === 3) return { label: "Bedeckt", icon: Cloud, color: "#6088a3" };
  if (code <= 48) return { label: "Nebel", icon: Cloud, color: "#8a8a8a" };
  if (code === 51) return { label: "Leichter Niesel", icon: CloudRain, color: "#6088a3" };
  if (code === 53) return { label: "Niesel", icon: CloudRain, color: "#6088a3" };
  if (code === 55) return { label: "Starker Niesel", icon: CloudRain, color: "#3a5a6b" };
  if (code === 61) return { label: "Leichter Regen", icon: CloudRain, color: "#6088a3" };
  if (code === 63) return { label: "Regen", icon: CloudRain, color: "#3a5a6b" };
  if (code === 65) return { label: "Starker Regen", icon: CloudRain, color: "#3a5a6b" };
  if (code <= 67) return { label: "Regen", icon: CloudRain, color: "#3a5a6b" };
  if (code === 71) return { label: "Leichter Schnee", icon: CloudSnow, color: "#8a9aa3" };
  if (code === 73) return { label: "Schnee", icon: CloudSnow, color: "#8a9aa3" };
  if (code === 75) return { label: "Starker Schnee", icon: CloudSnow, color: "#8a9aa3" };
  if (code <= 77) return { label: "Schnee", icon: CloudSnow, color: "#8a9aa3" };
  if (code === 80) return { label: "Leichte Schauer", icon: CloudRain, color: "#3a5a6b" };
  if (code === 81) return { label: "Schauer", icon: CloudRain, color: "#3a5a6b" };
  if (code === 82) return { label: "Heftige Schauer", icon: CloudRain, color: "#3a5a6b" };
  if (code === 96 || code === 99) return { label: "Gewitter mit Hagel", icon: CloudRain, color: "#4a3a6b" };
  if (code <= 99) return { label: "Gewitter", icon: CloudRain, color: "#4a3a6b" };
  return null;
}

function WetterBadge({ wetter, temp, tempMin, tempMax, niederschlag }) {
  const info = wetterInfo(wetter);
  if (!info) return null;
  const Ic = info.icon;
  const hasRain = niederschlag != null && niederschlag !== "" && +niederschlag > 0;
  const hasMinMax = tempMin != null && tempMin !== "" && tempMax != null && tempMax !== "";
  const hasSingle = !hasMinMax && temp !== null && temp !== "" && temp !== undefined;
  return (
    <span className="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full" style={{ background: "#f0ece0", color: info.color }}>
      <Ic size={11} />
      <span>{info.label}</span>
      {hasMinMax && <span className="font-mono">· {tempMin}…{tempMax}°C</span>}
      {hasSingle && <span className="font-mono">· {temp}°C</span>}
      {hasRain && <span className="font-mono">· {(+niederschlag).toFixed(1)}mm</span>}
    </span>
  );
}

// Wetter-Fetch (Open-Meteo Historical / Forecast)
async function fetchWetter(lat, lng, datum) {
  const d = parseISO(datum);
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const isFuture = d > heute;
  const isPast = d < heute;
  try {
    // daily liefert Min/Max/Niederschlag zuverlässig. Für den Wetter-Code nutzen wir
    // hourly statt daily, denn der daily-weather_code ist laut Open-Meteo-Doku der
    // "schwerste" Code des Tages — ein 1h-Gewitter morgens würde so den ganzen Tag
    // als "Gewitter" markieren. Der stündliche Modus (6-20 Uhr) ergibt den
    // dominanten Tageszustand.
    const daily = "temperature_2m_max,temperature_2m_min,precipitation_sum";
    const hourly = "weather_code";
    const base = isPast || d.getTime() === heute.getTime()
      ? "https://archive-api.open-meteo.com/v1/archive"
      : "https://api.open-meteo.com/v1/forecast";
    const url = `${base}?latitude=${lat}&longitude=${lng}&start_date=${datum}&end_date=${datum}&daily=${daily}&hourly=${hourly}&timezone=Europe%2FBerlin`;

    const r = await fetch(url);
    const data = await r.json();

    // Dominanter weather_code aus den Stunden 6-20 Uhr (Modus)
    let dominantCode = null;
    if (data.hourly?.weather_code && data.hourly?.time) {
      const counts = {};
      data.hourly.time.forEach((t, i) => {
        const hour = parseInt(t.slice(11, 13)); // "2024-09-15T08:00" → 8
        if (hour >= 6 && hour <= 20) {
          const code = data.hourly.weather_code[i];
          if (code != null) counts[code] = (counts[code] || 0) + 1;
        }
      });
      let maxCount = 0;
      for (const [code, count] of Object.entries(counts)) {
        if (count > maxCount) { maxCount = count; dominantCode = parseInt(code); }
      }
    }

    if (data.daily) {
      const tMax = data.daily.temperature_2m_max[0];
      const tMin = data.daily.temperature_2m_min[0];
      const niederschlag = data.daily.precipitation_sum?.[0];
      const round1 = v => v == null ? null : Math.round(v * 10) / 10;
      return {
        wetter: dominantCode,
        temp_min: round1(tMin),
        temp_max: round1(tMax),
        temperatur: tMax != null && tMin != null ? Math.round((tMax + tMin) / 2) : null,
        niederschlag: round1(niederschlag),
      };
    }
  } catch (e) { console.error(e); }
  return null;
}

// Thumbnail-Erzeugung (Canvas)
async function erzeugeThumbnail(file, maxSize = 300) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(maxSize / img.width, maxSize / img.height, 1);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * ratio;
        canvas.height = img.height * ratio;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve({ full: e.target.result, thumb: canvas.toDataURL("image/jpeg", 0.75) });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

                <div className="font-display text-xl" style={{ fontWeight: 600 }}>
                  KW {grp.kw} / {grp.jahr}
                </div>
              </div>
              <button onClick={onClose} className="p-1"><X size={18} /></button>
            </div>
            <p className="text-sm text-[#4a4a4a] mb-4">
              Die Druckansicht wird im A4-Format erzeugt. Im folgenden Druckdialog kannst du
              „Als PDF speichern" wählen. Bitte Kopf-/Fußzeilen ggf. im Druckdialog deaktivieren
              (schickere Optik).
            </p>
            <div className="flex justify-end gap-2">
              <button className="btn-ghost" onClick={onClose}>Abbrechen</button>
              <button className="btn-primary flex items-center gap-2" onClick={doPrint}>
                <Printer size={14} /> Drucken / als PDF speichern
              </button>
            </div>
          </div>
        </div>
      </div>

      {/* Print-Area (nur im Druck sichtbar) */}
      <div className="print-area">
        <div className="print-page" style={{ fontFamily: "'IBM Plex Sans', system-ui, sans-serif", color: "#1a1a1a", fontSize: "10pt" }}>
          {/* Kopf */}
          <div style={{ borderBottom: "2px solid #2d5a3d", paddingBottom: "0.5cm", marginBottom: "0.8cm" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
              <div>
                <div style={{ fontSize: "8pt", letterSpacing: "0.15em", textTransform: "uppercase", color: "#6b6b6b" }}>
                  Ausbildungsnachweis · Berichtsheft
                </div>
                <div style={{ fontFamily: "'Fraunces', serif", fontSize: "22pt", fontWeight: 600, marginTop: "0.1cm" }}>
                  Kalenderwoche {grp.kw} / {grp.jahr}
                </div>
                <div style={{ fontSize: "10pt", color: "#4a4a4a", marginTop: "0.1cm" }}>
                  {montag.toLocaleDateString("de-DE", { day:"2-digit", month:"long", year:"numeric" })} –
                  {" "}{sonntag.toLocaleDateString("de-DE", { day:"2-digit", month:"long", year:"numeric" })}
                </div>
              </div>
              <div style={{ textAlign: "right", fontSize: "9pt", color: "#4a4a4a" }}>
                <div style={{ fontWeight: 600, color: "#1a1a1a" }}>{config.name || "—"}</div>
                <div>{beruf?.label}</div>
                <div style={{ fontSize: "8pt", color: "#6b6b6b", marginTop: "0.1cm" }}>
                  Beginn: {fmtDE(parseISO(config.start_datum))}
                </div>
              </div>
            </div>
          </div>

          {/* Berichte */}
          {sortiert.map(b => {
            const d = parseISO(b.datum);
            const winfo = wetterInfo(b.wetter);
            return (
              <div key={b.datum} style={{ marginBottom: "0.7cm", pageBreakInside: "avoid" }}>
                <div style={{ display: "flex", alignItems: "baseline", gap: "0.5cm", borderBottom: "1px solid #e5e0d4", paddingBottom: "0.15cm", marginBottom: "0.3cm" }}>
                  <div style={{ fontFamily: "'Fraunces', serif", fontSize: "14pt", fontWeight: 600, color: "#2d5a3d" }}>
                    {DE_WD_LONG[(d.getDay()+6)%7]}, {d.getDate().toString().padStart(2,"0")}.{(d.getMonth()+1).toString().padStart(2,"0")}.
                  </div>
                  <div style={{ flex: 1, fontSize: "11pt", fontWeight: 500 }}>
                    {b.titel || "(Ohne Titel)"}
                  </div>
                  {winfo && (
                    <div style={{ fontSize: "8pt", color: "#6b6b6b" }}>
                      {winfo.label}
                      {b.temp_min != null && b.temp_min !== "" && b.temp_max != null && b.temp_max !== ""
                        ? ` · ${b.temp_min}…${b.temp_max}°C`
                        : (b.temperatur != null && b.temperatur !== "" && ` · ${b.temperatur}°C`)}
                      {b.niederschlag != null && b.niederschlag !== "" && +b.niederschlag > 0 && ` · ${(+b.niederschlag).toFixed(1)}mm`}
                    </div>
                  )}
                </div>

                {/* Meta-Grid */}
                {(b.stundenvon || b.ort || b.personen || b.werkzeuge) && (
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0.2cm 0.6cm", fontSize: "8.5pt", marginBottom: "0.3cm", color: "#4a4a4a" }}>
                    {(b.stundenvon || b.stundenbis) && <div><strong style={{ color: "#1a1a1a" }}>Zeit:</strong> {b.stundenvon} – {b.stundenbis}</div>}
                    {b.ort && <div><strong style={{ color: "#1a1a1a" }}>Ort:</strong> {b.ort}</div>}
                    {b.personen && <div><strong style={{ color: "#1a1a1a" }}>Personen:</strong> {b.personen}</div>}
                    {b.werkzeuge && <div><strong style={{ color: "#1a1a1a" }}>Werkzeuge:</strong> {b.werkzeuge}</div>}
                  </div>
                )}

                {b.taetigkeiten && (
                  <div style={{ marginBottom: "0.2cm" }}>
                    <div style={{ fontSize: "8pt", letterSpacing: "0.1em", textTransform: "uppercase", color: "#6b6b6b", marginBottom: "0.1cm" }}>Tätigkeiten</div>
                    <div style={{ fontSize: "10pt", lineHeight: 1.4 }}>{b.taetigkeiten}</div>
                  </div>
                )}
                {b.lerninhalte && (
                  <div style={{ marginBottom: "0.2cm" }}>
                    <div style={{ fontSize: "8pt", letterSpacing: "0.1em", textTransform: "uppercase", color: "#6b6b6b", marginBottom: "0.1cm" }}>Lerninhalte</div>
                    <div style={{ fontSize: "10pt", lineHeight: 1.4 }}>{b.lerninhalte}</div>
                  </div>
                )}
                {b.besonderheiten && (
                  <div style={{ marginBottom: "0.2cm" }}>
                    <div style={{ fontSize: "8pt", letterSpacing: "0.1em", textTransform: "uppercase", color: "#6b6b6b", marginBottom: "0.1cm" }}>Besondere Vorkommnisse</div>
                    <div style={{ fontSize: "10pt", lineHeight: 1.4 }}>{b.besonderheiten}</div>
                  </div>
                )}
                {b.unterweisung && (
                  <div style={{ marginBottom: "0.2cm" }}>
                    <div style={{ fontSize: "8pt", letterSpacing: "0.1em", textTransform: "uppercase", color: "#6b6b6b", marginBottom: "0.1cm" }}>Unterweisung</div>
                    <div style={{ fontSize: "10pt", lineHeight: 1.4 }}>{b.unterweisung}</div>
                  </div>
                )}

                {/* Fotos */}
                {b.bilder?.length > 0 && (
                  <div style={{ marginTop: "0.25cm", display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "0.15cm" }}>
                    {b.bilder.slice(0, 4).map(bId => (
                      bilderDaten[bId] && (
                        <img key={bId} src={bilderDaten[bId]} alt="" style={{ width: "100%", height: "3cm", objectFit: "cover", borderRadius: "2px", border: "1px solid #e5e0d4" }} />
                      )
                    ))}
                  </div>
                )}
              </div>
            );
          })}

          {/* Fuß */}
          <div style={{ marginTop: "1.2cm", paddingTop: "0.4cm", borderTop: "1px solid #e5e0d4", fontSize: "8pt", color: "#6b6b6b", display: "flex", justifyContent: "space-between" }}>
            <div>Ausbildungsnachweis gem. § 13 Abs. 1 Nr. 7 BBiG</div>
            <div>Erstellt {new Date().toLocaleDateString("de-DE")}</div>
          </div>

          {/* Unterschrift-Kasten */}
          <div style={{ marginTop: "1cm", display: "grid", gridTemplateColumns: "1fr 1fr", gap: "1.5cm", fontSize: "9pt" }}>
            <div>
              <div style={{ borderBottom: "1px solid #1a1a1a", height: "1.2cm" }} />
              <div style={{ marginTop: "0.15cm", color: "#6b6b6b" }}>Auszubildende/r</div>
            </div>
            <div>
              <div style={{ borderBottom: "1px solid #1a1a1a", height: "1.2cm" }} />
              <div style={{ marginTop: "0.15cm", color: "#6b6b6b" }}>Ausbilder/in</div>
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

// ============================================================
//  STATISTIK
// ============================================================
function Statistik({ config, tage, k, berichte, phasen }) {
  const proMonat = useMemo(() => {
    const m = {};
    Object.values(tage).forEach(t => {
      const key = t.datum.slice(0, 7);
      if (!m[key]) m[key] = { monat: fmtMonYear(key), krank: 0, urlaub: 0, anwesend: 0 };
      if (t.status === "krank") m[key].krank++;
      else if (t.status === "urlaub") m[key].urlaub++;
      else if (["anwesend","berufsschule","lerntag","ueba"].includes(t.status)) m[key].anwesend++;
    });
    return Object.values(m);
  }, [tage]);

  const dl = (c, f, m) => { const b = new Blob([c], { type: m }); const u = URL.createObjectURL(b); const a = document.createElement("a"); a.href = u; a.download = f; a.click(); URL.revokeObjectURL(u); };
  const sqlEsc = v => v == null ? "NULL" : typeof v === "number" ? v.toString() : `'${String(v).replace(/'/g, "''")}'`;

  function exportJSON() {
    dl(JSON.stringify({ config, tage: Object.values(tage), berichte }, null, 2), "ausbildung_export.json", "application/json");
  }
  function exportSQL() {
    let s = `-- Gärtnerausbildung Export · ${new Date().toISOString()}\n\n`;
    s += `CREATE TABLE IF NOT EXISTS config (id INTEGER PRIMARY KEY CHECK (id=1), name TEXT, beruf_id TEXT, geburtsdatum TEXT, start_datum TEXT, regulaer_dauer_monate INTEGER, teilzeit_prozent INTEGER, vollzeit_wochenstunden REAL, berufsschule_modus TEXT, zp_monat TEXT, ap_monat TEXT, standort_name TEXT, standort_lat REAL, standort_lng REAL);\n`;
    s += `CREATE TABLE IF NOT EXISTS arbeitstage (datum TEXT PRIMARY KEY, status TEXT, stunden REAL, bemerkung TEXT);\n`;
    s += `CREATE TABLE IF NOT EXISTS tagesberichte (datum TEXT PRIMARY KEY, titel TEXT, taetigkeiten TEXT, lerninhalte TEXT, unterweisung TEXT, wetter INTEGER, temperatur REAL, temp_min REAL, temp_max REAL, niederschlag REAL, ort TEXT, personen TEXT, werkzeuge TEXT, besonderheiten TEXT, stundenvon TEXT, stundenbis TEXT);\n\n`;
    s += `INSERT OR REPLACE INTO config VALUES (1, ${sqlEsc(config.name)}, ${sqlEsc(config.beruf_id)}, ${sqlEsc(config.geburtsdatum || null)}, ${sqlEsc(config.start_datum)}, ${config.regulaer_dauer_monate}, ${config.teilzeit_prozent}, ${config.vollzeit_wochenstunden}, ${sqlEsc(config.berufsschule_modus)}, ${sqlEsc(config.zp_monat || null)}, ${sqlEsc(config.ap_monat || null)}, ${sqlEsc(config.standort_name || null)}, ${config.standort_lat ?? "NULL"}, ${config.standort_lng ?? "NULL"});\n\n`;
    Object.values(tage).forEach(t => { s += `INSERT OR REPLACE INTO arbeitstage VALUES (${sqlEsc(t.datum)}, ${sqlEsc(t.status)}, ${t.stunden ?? "NULL"}, ${sqlEsc(t.bemerkung || null)});\n`; });
    s += "\n";
    berichte.forEach(b => {
      s += `INSERT OR REPLACE INTO tagesberichte VALUES (${sqlEsc(b.datum)}, ${sqlEsc(b.titel)}, ${sqlEsc(b.taetigkeiten)}, ${sqlEsc(b.lerninhalte)}, ${sqlEsc(b.unterweisung)}, ${b.wetter ?? "NULL"}, ${b.temperatur ?? "NULL"}, ${b.temp_min ?? "NULL"}, ${b.temp_max ?? "NULL"}, ${b.niederschlag ?? "NULL"}, ${sqlEsc(b.ort || null)}, ${sqlEsc(b.personen || null)}, ${sqlEsc(b.werkzeuge || null)}, ${sqlEsc(b.besonderheiten || null)}, ${sqlEsc(b.stundenvon || null)}, ${sqlEsc(b.stundenbis || null)});\n`;
    });
    dl(s, "ausbildung.sql", "text/plain");
  }

  return (
    <div className="py-6 sm:py-8 space-y-6">
      <div className="paper p-6">
        <h2 className="font-display text-xl mb-4" style={{ fontWeight: 600 }}>Monatsverlauf</h2>
        {proMonat.length === 0 ? (
          <p className="text-sm text-[#6b6b6b] py-8 text-center">Noch keine Daten.</p>
        ) : (
          <div className="h-[280px]">
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={proMonat}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e5e0d4" />
                <XAxis dataKey="monat" stroke="#6b6b6b" fontSize={11} />
                <YAxis stroke="#6b6b6b" fontSize={11} />
                <RTooltip contentStyle={{ background: "#fff", border: "1px solid #e5e0d4", borderRadius: 3 }} />
                <Legend wrapperStyle={{ fontSize: 12 }} />
                <Bar dataKey="anwesend" name="Anwesend" stackId="a" fill="#4a6b3a" />
                <Bar dataKey="urlaub" name="Urlaub" stackId="a" fill="#2e7d5a" />
                <Bar dataKey="krank" name="Krank" stackId="a" fill="#b04545" />
              </BarChart>
            </ResponsiveContainer>
          </div>
        )}
      </div>

      <div className="paper p-6">
        <h2 className="font-display text-xl mb-4" style={{ fontWeight: 600 }}>Kennzahlen</h2>
        <div className="grid sm:grid-cols-2 gap-x-8 gap-y-2 text-sm">
          <Row label="Ausbildungstage (Teilzeit-angepasst)" value={k.atGes.toString()} />
          <Row label="Abgeleistet (erfasst)" value={k.anwesend.toString()} />
          <Row label="Krankheitstage" value={k.krank.toString()} warn={k.krank >= k.fehltageSoft} />
          <Row label="10 %-Grenze" value={k.fehltageSoft.toString()} />
          <Row label="Urlaub gesamt" value={`${k.urlaubGenommen} / ${k.urlaubGesamt}`} />
          <Row label="Tagesberichte" value={berichte.length.toString()} />
          <Row label="Vergütung gesamt" value={`${Math.round(k.verguetungGesamt).toLocaleString("de-DE")} €`} />
          <Row label="Aktuelle Vergütung" value={`${k.aktVerg} €/Mon.`} />
        </div>
      </div>

      <div className="paper p-6">
        <h2 className="font-display text-xl mb-1" style={{ fontWeight: 600 }}>Datenbank</h2>
        <p className="text-xs text-[#6b6b6b] mb-4">Die gesamte Ausbildung wird lokal in einer SQLite-Datenbank gespeichert. Export zur Sicherung oder für DB-Browser (z. B. DB Browser for SQLite).</p>
        <div className="flex flex-wrap gap-2 mb-4">
          <button className="btn-primary flex items-center gap-2" onClick={exportDbAsFile}>
            <Database size={14} /> Als .db-Datei speichern
          </button>
          <label className="btn-ghost flex items-center gap-2 cursor-pointer">
            <Upload size={14} /> .db-Datei importieren
            <input type="file" accept=".db,.sqlite,.sqlite3,application/x-sqlite3" className="hidden"
              onChange={async e => {
                const f = e.target.files?.[0];
                if (!f) return;
                if (!confirm("Bestehende Daten werden durch die importierte Datei ersetzt. Fortfahren?")) return;
                await importDbFromFile(f);
                window.location.reload();
              }} />
          </label>
          <button className="btn-ghost flex items-center gap-2" style={{ color: "#b04545", borderColor: "#e8c0c0" }}
            onClick={async () => {
              if (!confirm("Wirklich alle Daten unwiderruflich zurücksetzen?")) return;
              await resetDatabase();
              window.location.reload();
            }}>
            <RefreshCw size={14} /> Zurücksetzen
          </button>
        </div>
        <div className="text-xs text-[#6b6b6b] border-t pt-3" style={{ borderColor: "#efece2" }}>
          <div>Datenbank erstellt: <span className="font-mono">{_dbMeta.created ? new Date(_dbMeta.created).toLocaleString("de-DE") : "–"}</span></div>
          <div>Zuletzt gespeichert: <span className="font-mono">{_dbMeta.modified ? new Date(_dbMeta.modified).toLocaleString("de-DE") : "–"}</span></div>
        </div>
      </div>

      <div className="paper p-6">
        <h2 className="font-display text-xl mb-1" style={{ fontWeight: 600 }}>JSON-Export</h2>
        <p className="text-xs text-[#6b6b6b] mb-4">Menschenlesbarer Snapshot ohne Bilder (für Archiv/Prüfung)</p>
        <button className="btn-ghost flex items-center gap-2" onClick={exportJSON}><Download size={14} /> JSON</button>
      </div>
    </div>
  );
}

function Row({ label, value, warn }) {
  return (
    <div className="flex justify-between py-1.5 border-b" style={{ borderColor: "#efece2" }}>
      <span className="text-[#6b6b6b]">{label}</span>
      <span className="font-mono" style={{ color: warn ? "#b04545" : "#1a1a1a", fontWeight: 500 }}>{value}</span>
    </div>
  );
}

// ============================================================
//  EINSTELLUNGEN
// ============================================================
function Einstellungen({ config, saveConfig, phasen, addPhase, savePhase, deletePhase }) {
  const [form, setForm] = useState(config);
  const [dirty, setDirty] = useState(false);
  const upd = (p, v) => {
    setForm(prev => {
      const c = JSON.parse(JSON.stringify(prev));
      const parts = p.split("."); let cur = c;
      for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
      cur[parts[parts.length - 1]] = v;
      return c;
    });
    setDirty(true);
  };
  const tz = form.teilzeit_prozent / 100;
  const dauerFaktor = Math.min(1 / tz, 1.5);
  const effektiveDauer = Math.max(6, form.regulaer_dauer_monate - (form.verkuerzung_monate || 0));
  const dauer = Math.round(effektiveDauer * dauerFaktor);
  const start = form.start_datum ? parseISO(form.start_datum) : null;
  const ende = start ? addMonths(start, dauer) : null;
  const zpAuto = zpTerminAuto(start, dauer);
  const apAuto = apTerminAuto(ende, form.vorzeitige_zulassung);
  const fmtMon = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;

  // Auto-Vorbelegung der Prüfungstermine, analog zu PruefungsPanel.
  // Nutzt setForm direkt, damit kein dirty-Flag gesetzt wird.
  // Beim Mount wird der Ref auf den gespeicherten Wert initialisiert, wenn er dem
  // aktuellen Auto-Vorschlag entspricht – damit der Tracking-Mechanismus greift.
  const prevZpRef = useRef(zpAuto && form.zp_monat === fmtMon(zpAuto) ? form.zp_monat : null);
  const prevApRef = useRef(apAuto && form.ap_monat === fmtMon(apAuto) ? form.ap_monat : null);
  useEffect(() => {
    const zpNeu = zpAuto ? fmtMon(zpAuto) : null;
    const apNeu = apAuto ? fmtMon(apAuto) : null;
    setForm(prev => {
      let changed = false;
      const next = { ...prev };
      if (zpNeu && (!prev.zp_monat || prev.zp_monat === prevZpRef.current)) {
        if (prev.zp_monat !== zpNeu) { next.zp_monat = zpNeu; changed = true; }
      }
      if (apNeu && (!prev.ap_monat || prev.ap_monat === prevApRef.current)) {
        if (prev.ap_monat !== apNeu) { next.ap_monat = apNeu; changed = true; }
      }
      return changed ? next : prev;
    });
    prevZpRef.current = zpNeu;
    prevApRef.current = apNeu;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [zpAuto?.getTime(), apAuto?.getTime()]);

  return (
    <div className="py-6 sm:py-8 max-w-3xl space-y-6">
      <div className="paper p-6 sm:p-8">
        <h2 className="font-display text-2xl mb-1" style={{ fontWeight: 600 }}>Einstellungen</h2>
        <p className="text-sm text-[#6b6b6b] mb-6">Anpassungen wirken sich automatisch auf Dauer, Vergütung, Urlaub und Prüfungstermine aus.</p>

        {/* Modus-Umschalter */}
        <div className="p-4 rounded-sm mb-6" style={{ background: "#fcfaf3", border: "1px solid #e5e0d4" }}>
          <div className="text-xs uppercase tracking-widest text-[#6b6b6b] mb-3">Nutzungsmodus</div>
          <div className="grid grid-cols-2 gap-2">
            {[
              { id: "vollstaendig", label: "Vollständig", desc: "mit Berichtsheft & Kalender" },
              { id: "beratung", label: "Beratungsmodus", desc: "nur Stamm- & Phasendaten" },
            ].map(o => {
              const akt = (form.modus || "vollstaendig") === o.id;
              return (
                <button key={o.id} onClick={() => upd("modus", o.id)}
                  className="text-left p-3 rounded-sm transition-colors"
                  style={{
                    background: akt ? "#e8f0e0" : "#fff",
                    border: akt ? "2px solid #2d5a3d" : "1px solid #d0cabc",
                    color: akt ? "#2d5a3d" : "#1a1a1a",
                  }}>
                  <div className="font-medium text-sm">{o.label}</div>
                  <div className="text-xs text-[#6b6b6b] mt-0.5">{o.desc}</div>
                </button>
              );
            })}
          </div>
        </div>

        {/* Anpassungs-Block: Verkürzung + Teilzeit + Vorzeitig */}
        <div className="p-5 rounded-sm mb-6 space-y-4" style={{ background: "#f7f4ec", border: "1px solid #e5e0d4" }}>
          <div className="text-xs uppercase tracking-widest text-[#6b6b6b]">Ausbildungsanpassungen</div>

          <div>
            <label className="label-base">Verkürzung (§ 8 BBiG)</label>
            <select className="input-base" value={form.verkuerzung_monate}
              onChange={e => upd("verkuerzung_monate", parseInt(e.target.value))}>
              <option value="0">Keine Verkürzung</option>
              <option value="6">6 Monate (Realschulabschluss)</option>
              <option value="12">12 Monate (FHR / Abitur)</option>
              <option value="18">18 Monate</option>
            </select>
          </div>

          <div>
            <label className="label-base flex items-center justify-between">
              <span>Teilzeit (§ 7a BBiG)</span>
              <span className="font-display text-lg" style={{ color: "#2d5a3d", fontWeight: 600 }}>{form.teilzeit_prozent}%</span>
            </label>
            <input type="range" min="50" max="100" step="5" value={form.teilzeit_prozent}
              onChange={e => upd("teilzeit_prozent", parseInt(e.target.value))}
              className="w-full accent-[#2d5a3d]" />
          </div>

          <label className="flex items-start gap-3 cursor-pointer">
            <input type="checkbox" checked={form.vorzeitige_zulassung}
              onChange={e => upd("vorzeitige_zulassung", e.target.checked)}
              className="mt-0.5 accent-[#2d5a3d]" />
            <div>
              <div className="text-sm font-medium">Vorzeitige Zulassung (§ 45 BBiG)</div>
              <div className="text-xs text-[#6b6b6b]">ZP Ø mind. überdurchschnittlich · AP einen Prüfungstermin früher</div>
            </div>
          </label>

          {/* Live-Vorschau */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-3 border-t" style={{ borderColor: "#e5e0d4" }}>
            <PreviewCell label="Dauer" value={`${dauer} Mon.`} />
            <PreviewCell label="Wochenstd." value={`${(form.vollzeit_wochenstunden * tz).toFixed(1)} h`} />
            {ende && <PreviewCell label="Ende" value={fmtDE(ende)} />}
            {apAuto && <PreviewCell label="AP" value={`${DE_MONTHS_SHORT[apAuto.getMonth()]} ${apAuto.getFullYear()}`} />}
          </div>

function PhasenEditor({ phasen, addPhase, savePhase, deletePhase, config }) {
  const [editing, setEditing] = useState(null);
  const [undoSnapshot, setUndoSnapshot] = useState(null); // {aktion, vorher: [...]} für Rückgängig
  const sorted = phasenSortiert(phasen || []);
  const probleme = phasenValidieren(sorted);
  const phasenMit = phasen?.length
    ? phasenMitEnden(phasen, config.regulaer_dauer_monate, config.verkuerzung_monate)
    : [];
  const vertragsende = vertragsendeAusPhasen(phasenMit);

  function neuePhase() {
    // Schlauer Default: anhängen an letzte Phase
    const letzte = sorted[sorted.length - 1];
    const heute = fmtISO(new Date());
    const von = letzte?.bis || heute;
    setEditing({
      von, bis: "", typ: "ausbildung", betrieb: letzte?.betrieb || "",
      teilzeit_prozent: letzte?.teilzeit_prozent || 100,
      grund: "", pauschal_fehltage_e: 0, pauschal_fehltage_u: 0, anmerkung: "",
    });
  }

  function handleSpeichern(formPhase, konfliktInfo) {
    // Snapshot für Undo: alle Phasen kopieren
    const snapshot = phasen.map(p => ({ ...p }));
    const aktion = formPhase.id ? "bearbeitet" : "neu";

    if (konfliktInfo && konfliktInfo.aufloesung && konfliktInfo.aufloesung !== "ueberlappen") {
      const k = konfliktInfo.konflikt;
      if (konfliktInfo.aufloesung === "kuerzen") {
        // Alte Phase auf (neu.von - 1 Tag) kürzen
        const neuVon = parseISO(formPhase.von);
        const neuesBis = fmtISO(new Date(neuVon.getTime() - 86400000));
        savePhase(k.id, { ...k, bis: neuesBis });
      } else if (konfliktInfo.aufloesung === "splitten") {
        // Alte Phase kürzen (erster Teil)
        const neuVon = parseISO(formPhase.von);
        const neuesBis = fmtISO(new Date(neuVon.getTime() - 86400000));
        savePhase(k.id, { ...k, bis: neuesBis });
        // Zweiter Teil: neue Phase mit den gleichen Eigenschaften der alten,
        // startet ab (neu.bis + 1 Tag) bis zum alten bis
        if (formPhase.bis) {
          const neuEnde = parseISO(formPhase.bis);
          const teil2Von = fmtISO(new Date(neuEnde.getTime() + 86400000));
          addPhase({
            von: teil2Von, bis: k.bis, typ: k.typ,
            betrieb: k.betrieb, teilzeit_prozent: k.teilzeit_prozent,
            grund: k.grund, anmerkung: (k.anmerkung || "") + " (Fortsetzung nach Phaseneinschub)",
            pauschal_fehltage_e: 0, pauschal_fehltage_u: 0,
          });
        }
      }
    }
    // Eigentliche neue/bearbeitete Phase speichern
    if (formPhase.id) savePhase(formPhase.id, formPhase);
    else addPhase(formPhase);

    setUndoSnapshot({ aktion, vorher: snapshot });
    setEditing(null);
  }

  function handleUndo() {
    if (!undoSnapshot) return;
    if (!confirm("Letzte Phasen-Änderung wirklich rückgängig machen? Alle jetzt bestehenden Phasen werden durch den Zustand davor ersetzt.")) return;
    // Alle aktuellen Phasen löschen, Snapshot-Phasen wieder anlegen
    const aktuelleIds = phasen.map(p => p.id);
    aktuelleIds.forEach(id => deletePhase(id));
    undoSnapshot.vorher.forEach(p => {
      addPhase({
        von: p.von, bis: p.bis, typ: p.typ, betrieb: p.betrieb,
        teilzeit_prozent: p.teilzeit_prozent, grund: p.grund,
        pauschal_fehltage_e: p.pauschal_fehltage_e, pauschal_fehltage_u: p.pauschal_fehltage_u,
        anmerkung: p.anmerkung,
      });
    });
    setUndoSnapshot(null);
  }

  return (
    <div className="paper p-6 sm:p-8">
      <div className="flex items-start justify-between gap-3 mb-1">
        <h2 className="font-display text-2xl" style={{ fontWeight: 600 }}>Phasen / Verlauf</h2>
        <div className="flex gap-2">
          {undoSnapshot && (
            <button className="btn-ghost text-xs flex items-center gap-1" onClick={handleUndo} title="Letzte Phasenänderung rückgängig">
              <RefreshCw size={12} /> Rückgängig
            </button>
          )}
          <button className="btn-primary flex items-center gap-2" onClick={neuePhase}>
            <Plus size={14} /> Phase
          </button>
        </div>
      </div>
      <p className="text-sm text-[#6b6b6b] mb-4 leading-relaxed">
        Zerlege die Ausbildung in zeitliche Phasen — z. B. Vollzeit, danach Teilzeit ab Geburt eines Kindes,
        Unterbrechung wegen Krankheit oder Wechsel des Ausbildungsbetriebs. Vergütung, Urlaub und Restzeit
        werden phasenbasiert berechnet.
      </p>

      {sorted.length === 0 && (
        <div className="text-center text-sm text-[#6b6b6b] py-8 rounded-sm" style={{ background: "#fcfaf3", border: "1px dashed #d0cabc" }}>
          Noch keine Phasen angelegt. Klicke oben auf „Phase".
        </div>
      )}

      {/* Validierungs-Hinweise */}
      {probleme.length > 0 && (
        <div className="mb-3 p-3 rounded-sm space-y-1" style={{ background: "#fdf0e3", border: "1px solid #e8b890" }}>
          {probleme.map((p, i) => (
            <div key={i} className="text-xs flex items-start gap-1.5" style={{ color: "#8a4a1a" }}>
              <AlertTriangle size={12} className="mt-0.5 flex-shrink-0" />
              <span>{p.text}</span>
            </div>
          ))}
        </div>
      )}

      {/* Phasen-Liste */}
      <div className="space-y-2">
        {sorted.map(p => <PhasenZeile key={p.id} phase={p} onEdit={() => setEditing({ ...p })} onDelete={() => {
          if (confirm(`Phase "${p.typ}" vom ${p.von} wirklich löschen?`)) deletePhase(p.id);
        }} />)}
      </div>

      {/* Bottom-Info */}
      {sorted.length > 0 && vertragsende && (
        <div className="mt-4 pt-4 border-t flex justify-between items-center text-sm" style={{ borderColor: "#e5e0d4" }}>
          <span className="text-[#6b6b6b]">Berechnetes Vertragsende:</span>
          <span className="font-mono font-medium">{fmtDE(vertragsende)}</span>
        </div>
      )}

      {/* Dialog */}
      {editing && <PhasenDialog phase={editing} alleDerPhasen={phasen || []}
        onClose={() => setEditing(null)}
        onSave={handleSpeichern} />}
    </div>
  );
}

function PhasenZeile({ phase, onEdit, onDelete }) {
  const isAusb = phase.typ === "ausbildung";
  const farbe = isAusb

    : "#9a8a6a";
  const bg = isAusb
    ? (phase.teilzeit_prozent < 100 ? "#eaf0e0" : "#e8f0e0")
    : "#f0ece0";
  const von = parseISO(phase.von);
  const bis = phase.bis ? parseISO(phase.bis) : null;
  const monate = bis ? Math.round(diffMonths(von, bis) * 10) / 10 : null;
  return (
    <div className="rounded-sm p-3 flex items-start gap-3" style={{ background: bg, border: `1px solid ${farbe}40` }}>
      <div className="w-1 self-stretch rounded-full" style={{ background: farbe }} />
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 flex-wrap">
          <span className="text-xs uppercase tracking-widest font-medium" style={{ color: farbe }}>
            {isAusb ? (phase.teilzeit_prozent < 100 ? `Teilzeit ${phase.teilzeit_prozent}%` : "Vollzeit") : "Unterbrechung"}
          </span>
          {phase.betrieb && <span className="text-xs text-[#6b6b6b]">· 🏢 {phase.betrieb}</span>}
          {phase.grund && <span className="text-xs text-[#6b6b6b]">· {phase.grund}</span>}
        </div>
        <div className="text-sm mt-1 font-mono">
          {fmtDE(von)} → {bis ? fmtDE(bis) : <span className="text-[#9a9a9a]">läuft</span>}
          {monate != null && <span className="text-[#6b6b6b] text-xs ml-2">({monate} Mon.)</span>}
        </div>
        {(phase.pauschal_fehltage_e > 0 || phase.pauschal_fehltage_u > 0) && (
          <div className="text-xs text-[#6b6b6b] mt-1">

        )}

      </div>
      <div className="flex gap-1 flex-shrink-0">
        <button onClick={onEdit} className="btn-ghost p-2" title="Bearbeiten"><Edit3 size={13} /></button>
        <button onClick={onDelete} className="btn-ghost p-2" style={{ color: "#b04545" }} title="Löschen"><Trash2 size={13} /></button>
      </div>
    </div>
  );
}

// Konflikt-Erkennung beim Anlegen/Bearbeiten einer Phase:
// Gibt Informationen zurück, welche bestehende Phase von der neuen Phase
// „geschnitten" wird — und welche Auflösungs-Strategien sinnvoll sind.
function phasenKonflikt(alle, neu) {
  if (!neu.von) return null;
  const eigeneId = neu.id ?? null;
  const neuVon = neu.von;
  const neuBis = neu.bis || null;
  // Phasen, die am neu.von-Datum aktiv sind (ohne die eigene ID)
  const betroffen = alle.filter(p => {
    if (p.id === eigeneId) return false;
    // aktiv am neuVon? p.von <= neuVon && (p.bis >= neuVon || p.bis leer)
    const aktivDortAn = p.von <= neuVon && (!p.bis || p.bis >= neuVon);
    return aktivDortAn;
  });
  if (!betroffen.length) return null;
  // Nimm die zeitlich relevanteste: die zuletzt beginnende
  const konflikt = betroffen.sort((a, b) => b.von.localeCompare(a.von))[0];
  const konfliktLaeuft = !konflikt.bis;
  const konfliktEndeNachNeuBis = konflikt.bis && neuBis && konflikt.bis > neuBis;
  // Auflösungs-Optionen
  const optionen = [];
  if (konflikt.von < neuVon) {
    // Kürzen: alte Phase auf (neuVon - 1 Tag) setzen
    optionen.push({ id: "kuerzen", label: `„${beschreibPhase(konflikt)}" am ${fmtDE(parseISO(neuVon))} beenden (empfohlen)`, empfohlen: true });
  }
  if (konfliktEndeNachNeuBis) {
    // Splitten: alte Phase wird in zwei Teile geteilt, neue dazwischen
    optionen.push({ id: "splitten", label: `„${beschreibPhase(konflikt)}" in zwei Teile teilen (vor & nach neuer Phase)` });
  }
  optionen.push({ id: "ueberlappen", label: "Nichts ändern — Überlappung akzeptieren (wird als Warnung markiert)" });
  return { konflikt, konfliktLaeuft, optionen };
}

function beschreibPhase(p) {
  if (p.typ === "unterbrechung") return `Unterbrechung${p.grund ? `: ${p.grund}` : ""}`;
  const tz = p.teilzeit_prozent || 100;
  return tz < 100 ? `Teilzeit ${tz}%` : "Vollzeit";
}

function PhasenDialog({ phase, alleDerPhasen, onClose, onSave }) {
  const [f, setF] = useState({ ...phase });
  const [aufloesung, setAufloesung] = useState(null); // "kuerzen" | "splitten" | "ueberlappen"
  const upd = (k, v) => setF(p => ({ ...p, [k]: v }));
  const isAusb = f.typ === "ausbildung";
  const fehler = !f.von ? "Beginn fehlt" : (f.bis && f.bis < f.von ? "Ende liegt vor dem Beginn" : null);

  // Konflikt mit bestehenden Phasen prüfen
  const konfliktInfo = phasenKonflikt(alleDerPhasen || [], f);
  // Default-Auflösung: "kuerzen" wenn angeboten, sonst "ueberlappen"
  useEffect(() => {
    if (konfliktInfo) {
      const empf = konfliktInfo.optionen.find(o => o.empfohlen);
      setAufloesung(prev => prev && konfliktInfo.optionen.some(o => o.id === prev) ? prev : (empf?.id || konfliktInfo.optionen[0].id));
    } else {
      setAufloesung(null);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [konfliktInfo?.konflikt?.id, f.von, f.bis]);

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/40" onClick={onClose}>
      <div className="paper w-full sm:max-w-lg p-6 max-h-[92vh] overflow-y-auto rounded-t-lg sm:rounded" onClick={e => e.stopPropagation()}>
        <div className="flex items-start justify-between mb-5">
          <h3 className="font-display text-xl" style={{ fontWeight: 600 }}>{phase.id ? "Phase bearbeiten" : "Neue Phase"}</h3>
          <button onClick={onClose} className="p-1"><X size={18} /></button>
        </div>

        {/* Typ */}
        <div className="mb-4">
          <label className="label-base">Phasentyp</label>
          <div className="grid grid-cols-2 gap-2">
            {[
              { id: "ausbildung", label: "Ausbildung", icon: GraduationCap, color: "#2d5a3d" },
              { id: "unterbrechung", label: "Unterbrechung", icon: Clock, color: "#9a8a6a" },
            ].map(t => {
              const Ic = t.icon, akt = f.typ === t.id;
              return (
                <button key={t.id} onClick={() => upd("typ", t.id)}
                  className="p-3 rounded-sm flex items-center gap-2 transition-colors"
                  style={{
                    background: akt ? `${t.color}15` : "#fff",
                    border: akt ? `2px solid ${t.color}` : "1px solid #d0cabc",
                    color: akt ? t.color : "#1a1a1a", fontWeight: akt ? 500 : 400,
                  }}>
                  <Ic size={15} /> {t.label}
                </button>
              );
            })}
          </div>
        </div>

        {/* Datum */}
        <div className="grid grid-cols-2 gap-3 mb-4">
          <Field label="Beginn">
            <input type="date" className="input-base" value={f.von} onChange={e => upd("von", e.target.value)} />
          </Field>
          <Field label="Ende" hint="leer = läuft">
            <input type="date" className="input-base" value={f.bis || ""} onChange={e => upd("bis", e.target.value)} />
          </Field>
        </div>
        {fehler && <div className="text-xs text-[#b04545] mb-3 flex items-center gap-1"><AlertTriangle size={12} /> {fehler}</div>}

        {/* Konflikt mit bestehender Phase */}
        {konfliktInfo && !fehler && (
          <div className="mb-4 p-3 rounded-sm" style={{ background: "#fdf7e3", border: "1px solid #e8d9a8" }}>

              <div className="text-xs leading-relaxed" style={{ color: "#7a5a1a" }}>
                Am <strong>{fmtDE(parseISO(f.von))}</strong> ist aktuell die Phase
                „<strong>{beschreibPhase(konfliktInfo.konflikt)}</strong>
                {konfliktInfo.konflikt.betrieb && <> · {konfliktInfo.konflikt.betrieb}</>}" aktiv
                ({fmtDE(parseISO(konfliktInfo.konflikt.von))}{" – "}
                {konfliktInfo.konfliktLaeuft ? "läuft" : fmtDE(parseISO(konfliktInfo.konflikt.bis))}).

            </div>

                  <span>{o.label}</span>
                </label>
              ))}
            </div>
          </div>
        )}

        {/* Ausbildungs-spezifisch */}

            </p>
          </>
        )}

        {/* Unterbrechung-spezifisch */}
        {!isAusb && (
          <Field label="Grund der Unterbrechung">
            <select className="input-base" value={f.grund || ""} onChange={e => upd("grund", e.target.value)}>
              <option value="">– bitte wählen –</option>
              <option>Krankheit (Langzeit)</option>
              <option>Mutterschutz</option>
              <option>Elternzeit</option>
              <option>Pflegezeit</option>
              <option>Auslandsaufenthalt (nicht angerechnet)</option>
              <option>Ruhensvereinbarung</option>
              <option>Sonstiges</option>
            </select>
          </Field>
        )}

        <Field label="Anmerkung (optional)">
          <textarea rows={2} className="input-base" value={f.anmerkung || ""} onChange={e => upd("anmerkung", e.target.value)} />
        </Field>

        <div className="flex justify-end gap-2 mt-6 pt-4 border-t" style={{ borderColor: "#e5e0d4" }}>
          <button className="btn-ghost" onClick={onClose}>Abbrechen</button>
          <button className="btn-primary" onClick={() => onSave(f, konfliktInfo ? { aufloesung, konflikt: konfliktInfo.konflikt } : null)} disabled={!!fehler || !f.von || !f.typ}>
            Speichern
          </button>
        </div>
      </div>
    </div>
  );
}

function PreviewCell({ label, value, hint }) {
  return (
    <div>
      <div className="text-[10px] uppercase tracking-widest text-[#6b6b6b]">{label}</div>
      <div className="font-mono font-medium text-[#1a1a1a]">{value} {hint && <span className="text-[#9a9a9a] text-xs">{hint}</span>}</div>
    </div>
  );
}


// Render App
createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
