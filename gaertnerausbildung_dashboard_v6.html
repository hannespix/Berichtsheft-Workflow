// ============================================================
//  SQLITE-DATENBANK (persistiert in IndexedDB, mit LocalStorage-Fallback)
// ============================================================
const IDB_NAME = "gaertnerdb";
const IDB_STORE = "kv";
const IDB_KEY_DB = "dbBytes";
const IDB_KEY_META = "meta";
const LS_KEY_DB = "gaertnerdb_bytes_b64";
const LS_KEY_META = "gaertnerdb_meta";

// Welches Backend ist aktiv? Wird in initDatabase() gesetzt.
let _storageBackend = "unknown"; // "indexeddb" | "localstorage" | "none"

// Prüfung: funktioniert IndexedDB wirklich?
async function idbProbe() {
  if (typeof indexedDB === "undefined") return false;
  try {
    await new Promise((resolve, reject) => {
      const req = indexedDB.open("__probe__" + Math.random().toString(36).slice(2), 1);
      req.onsuccess = () => { req.result.close(); resolve(); };
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error("blocked"));
      setTimeout(() => reject(new Error("timeout")), 2000);
    });
    return true;
  } catch {
    return false;
  }
}

// IndexedDB-Wrapper
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// Uint8Array ↔ base64 für LocalStorage-Fallback
function bytesToBase64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function base64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// Abstrahierte Storage-Funktionen mit Backend-Wahl
async function storageLoadDb() {
  if (_storageBackend === "indexeddb") {
    return await idbGet(IDB_KEY_DB);
  } else if (_storageBackend === "localstorage") {
    const b64 = localStorage.getItem(LS_KEY_DB);
    return b64 ? base64ToBytes(b64) : null;
  }
  return null;
}
async function storageSaveDb(bytes) {
  if (_storageBackend === "indexeddb") {
    await idbSet(IDB_KEY_DB, bytes);
  } else if (_storageBackend === "localstorage") {
    // LocalStorage hat ~5 MB Limit
    const b64 = bytesToBase64(bytes);
    try {
      localStorage.setItem(LS_KEY_DB, b64);
    } catch (e) {
      // QuotaExceeded — weiterwerfen, damit das UI den Fehler anzeigen kann
      throw new Error("LocalStorage voll (~5 MB Limit). Bitte Bilder entfernen oder .db exportieren.");
    }
  }
}
async function storageLoadMeta() {
  if (_storageBackend === "indexeddb") return await idbGet(IDB_KEY_META);
  if (_storageBackend === "localstorage") {
    const s = localStorage.getItem(LS_KEY_META);
    return s ? JSON.parse(s) : null;
  }
  return null;
}
async function storageSaveMeta(meta) {
  if (_storageBackend === "indexeddb") await idbSet(IDB_KEY_META, meta);
  else if (_storageBackend === "localstorage") localStorage.setItem(LS_KEY_META, JSON.stringify(meta));
}

// Schema
const SCHEMA = `
CREATE TABLE IF NOT EXISTS config (
  id INTEGER PRIMARY KEY CHECK (id=1),
  name TEXT, beruf_id TEXT, geburtsdatum TEXT, start_datum TEXT,
  regulaer_dauer_monate INTEGER, verkuerzung_monate INTEGER, vorzeitige_zulassung INTEGER,
  teilzeit_prozent INTEGER, vollzeit_wochenstunden REAL, berufsschule_modus TEXT,
  zp_monat TEXT, ap_monat TEXT,
  standort_name TEXT, standort_lat REAL, standort_lng REAL,
  modus TEXT
);
CREATE TABLE IF NOT EXISTS arbeitstage (
  datum TEXT PRIMARY KEY, status TEXT, stunden REAL, bemerkung TEXT
);
CREATE TABLE IF NOT EXISTS tagesberichte (
  datum TEXT PRIMARY KEY, titel TEXT, taetigkeiten TEXT, lerninhalte TEXT,
  unterweisung TEXT, wetter INTEGER, temperatur REAL, temp_min REAL, temp_max REAL,
  niederschlag REAL, ort TEXT,
  personen TEXT, werkzeuge TEXT, besonderheiten TEXT, stundenvon TEXT, stundenbis TEXT
);
CREATE TABLE IF NOT EXISTS bilder (
  id TEXT PRIMARY KEY, bericht_datum TEXT, data TEXT, thumb TEXT, name TEXT
);
CREATE TABLE IF NOT EXISTS phasen (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  von TEXT NOT NULL,
  bis TEXT,
  typ TEXT NOT NULL CHECK (typ IN ('ausbildung','unterbrechung')),
  betrieb TEXT,
  teilzeit_prozent INTEGER,
  grund TEXT,
  pauschal_fehltage_e INTEGER DEFAULT 0,
  pauschal_fehltage_u INTEGER DEFAULT 0,
  anmerkung TEXT
);
`;

// sql.js wird via globalem initSqlJs aus dem CDN geladen
let SQL = null;
let _db = null;
let _dbMeta = { created: null, modified: null };
let _lastSaveError = null;
let _pendingSave = false;

async function initDatabase() {
  if (!SQL) {
    SQL = await window.initSqlJs({
      locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`,
    });
  }

  // Backend wählen: IndexedDB bevorzugt, sonst LocalStorage, sonst gar nichts
  const idbOk = await idbProbe();
  if (idbOk) _storageBackend = "indexeddb";
  else if (typeof localStorage !== "undefined") {
    try {
      localStorage.setItem("__probe__", "1");
      localStorage.removeItem("__probe__");
      _storageBackend = "localstorage";
    } catch { _storageBackend = "none"; }
  } else _storageBackend = "none";

  const stored = await storageLoadDb();
  let status = { existierte: false, bytes: 0, geladen: false, backend: _storageBackend };
  if (stored) {
    status.bytes = stored.byteLength || stored.length || 0;
    try {
      _db = new SQL.Database(stored);
      status.existierte = true;
      status.geladen = true;
    } catch (e) {
      console.warn("Bestehende DB konnte nicht geladen werden, lege neue an:", e);
      _db = new SQL.Database();
    }
  } else {
    _db = new SQL.Database();
  }
  _db.exec(SCHEMA);
  // Migrationen für bestehende DBs (Errors bei existierenden Spalten ignorieren)
  try { _db.run("ALTER TABLE tagesberichte ADD COLUMN niederschlag REAL"); } catch {}
  try { _db.run("ALTER TABLE tagesberichte ADD COLUMN temp_min REAL"); } catch {}
  try { _db.run("ALTER TABLE tagesberichte ADD COLUMN temp_max REAL"); } catch {}
  try { _db.run("ALTER TABLE config ADD COLUMN modus TEXT"); } catch {}

  // Migration: Wenn Config existiert aber noch keine Phase, lege eine Standardphase an
  const cfgRows = rowsToObjects(_db.exec("SELECT start_datum, teilzeit_prozent, regulaer_dauer_monate, verkuerzung_monate FROM config WHERE id=1"));
  const phasenRows = rowsToObjects(_db.exec("SELECT COUNT(*) AS c FROM phasen"));
  if (cfgRows.length && phasenRows[0].c === 0 && cfgRows[0].start_datum) {
    const c = cfgRows[0];
    _db.run(
      `INSERT INTO phasen (von, bis, typ, teilzeit_prozent, anmerkung) VALUES (?,?,?,?,?)`,
      [c.start_datum, null, "ausbildung", c.teilzeit_prozent || 100, "Initial-Phase aus V5-Migration"]
    );
  }
  const meta = await storageLoadMeta();
  if (meta) _dbMeta = meta;
  else {
    _dbMeta = { created: new Date().toISOString(), modified: null };
    try { await storageSaveMeta(_dbMeta); } catch (e) { console.warn(e); }
  }

  // Wenn die DB gerade erst angelegt wurde (keine gespeicherte Version), sofort initial persistieren
  if (!stored && _storageBackend !== "none") {
    try {
      const bytes = _db.export();
      await storageSaveDb(bytes);
      _dbMeta.modified = new Date().toISOString();
      await storageSaveMeta(_dbMeta);
      status.initial_gespeichert = true;
    } catch (e) {
      console.warn("Initial-Speichern fehlgeschlagen:", e);
    }
  }

  // Status-Zusammenfassung für UI
  const cfgCount = rowsToObjects(_db.exec("SELECT COUNT(*) AS c FROM config WHERE start_datum IS NOT NULL"))[0].c;
  const phasenCount = rowsToObjects(_db.exec("SELECT COUNT(*) AS c FROM phasen"))[0].c;
  const tageCount = rowsToObjects(_db.exec("SELECT COUNT(*) AS c FROM arbeitstage"))[0].c;
  const berichteCount = rowsToObjects(_db.exec("SELECT COUNT(*) AS c FROM tagesberichte"))[0].c;
  status.hatDaten = cfgCount > 0 || phasenCount > 0 || tageCount > 0 || berichteCount > 0;
  status.counts = { config: cfgCount, phasen: phasenCount, tage: tageCount, berichte: berichteCount };
  status.meta = _dbMeta;
  return status;
}

let _persistTimer = null;
let _persistListeners = [];

function onPersistStatus(cb) {
  _persistListeners.push(cb);
  return () => { _persistListeners = _persistListeners.filter(l => l !== cb); };
}
function notifyPersist(status) {
  _persistListeners.forEach(l => { try { l(status); } catch {} });
}

function persistDb() {
  _pendingSave = true;
  if (_persistTimer) clearTimeout(_persistTimer);
  notifyPersist({ state: "pending" });
  _persistTimer = setTimeout(async () => {
    if (_storageBackend === "none") {
      _lastSaveError = "Kein persistenter Speicher verfügbar (IndexedDB und LocalStorage blockiert).";
      _pendingSave = false;
      notifyPersist({ state: "error", message: _lastSaveError });
      return;
    }
    try {
      const bytes = _db.export();
      _dbMeta.modified = new Date().toISOString();
      await storageSaveDb(bytes);
      await storageSaveMeta(_dbMeta);
      _lastSaveError = null;
      _pendingSave = false;
      notifyPersist({ state: "saved", modified: _dbMeta.modified, bytes: bytes.length });
    } catch (e) {
      _lastSaveError = e.message || String(e);
      _pendingSave = false;
      notifyPersist({ state: "error", message: _lastSaveError });
    }
  }, 300);
}

// Helper: query ausführen, Zeilen als Objekte zurückgeben
function rowsToObjects(result) {
  if (!result.length) return [];
  return result[0].values.map(row => {
    const o = {};
    result[0].columns.forEach((c, i) => (o[c] = row[i]));
    return o;
  });
}

// === Data-Access ===
function dbGetConfig() {
  const r = rowsToObjects(_db.exec("SELECT * FROM config WHERE id=1"));
  if (!r.length) return null;
  const c = r[0];
  c.vorzeitige_zulassung = !!c.vorzeitige_zulassung;
  return c;
}
function dbSaveConfig(c) {
  _db.run(
    `INSERT OR REPLACE INTO config
     (id, name, beruf_id, geburtsdatum, start_datum, regulaer_dauer_monate, verkuerzung_monate,
      vorzeitige_zulassung, teilzeit_prozent, vollzeit_wochenstunden, berufsschule_modus,
      zp_monat, ap_monat, standort_name, standort_lat, standort_lng, modus)
     VALUES (1,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
    [
      c.name || null, c.beruf_id, c.geburtsdatum || null, c.start_datum,
      c.regulaer_dauer_monate, c.verkuerzung_monate || 0, c.vorzeitige_zulassung ? 1 : 0,
      c.teilzeit_prozent, c.vollzeit_wochenstunden, c.berufsschule_modus,
      c.zp_monat || null, c.ap_monat || null,
      c.standort_name || null, c.standort_lat, c.standort_lng,
      c.modus || "vollstaendig",
    ]
  );
  persistDb();
}

// === Phasen ===
function dbGetPhasen() {
  return rowsToObjects(_db.exec("SELECT * FROM phasen ORDER BY von ASC, id ASC"));
}
function dbAddPhase(p) {
  _db.run(
    `INSERT INTO phasen (von, bis, typ, betrieb, teilzeit_prozent, grund, pauschal_fehltage_e, pauschal_fehltage_u, anmerkung)
     VALUES (?,?,?,?,?,?,?,?,?)`,
    [
      p.von, p.bis || null, p.typ, p.betrieb || null,
      p.teilzeit_prozent ?? 100, p.grund || null,
      p.pauschal_fehltage_e || 0, p.pauschal_fehltage_u || 0, p.anmerkung || null,
    ]
  );
  persistDb();
}
function dbUpdatePhase(id, p) {
  _db.run(
    `UPDATE phasen SET von=?, bis=?, typ=?, betrieb=?, teilzeit_prozent=?, grund=?,
     pauschal_fehltage_e=?, pauschal_fehltage_u=?, anmerkung=? WHERE id=?`,
    [
      p.von, p.bis || null, p.typ, p.betrieb || null,
      p.teilzeit_prozent ?? 100, p.grund || null,
      p.pauschal_fehltage_e || 0, p.pauschal_fehltage_u || 0, p.anmerkung || null,
      id,
    ]
  );
  persistDb();
}
function dbDeletePhase(id) {
  _db.run("DELETE FROM phasen WHERE id=?", [id]);
  persistDb();
}
function dbGetTage() {
  const r = rowsToObjects(_db.exec("SELECT * FROM arbeitstage"));
  const o = {};
  r.forEach(t => (o[t.datum] = t));
  return o;
}
function dbSaveTag(datum, data) {
  _db.run(
    "INSERT OR REPLACE INTO arbeitstage VALUES (?,?,?,?)",
    [datum, data.status, data.stunden ?? null, data.bemerkung || null]
  );
  persistDb();
}
function dbDeleteTag(datum) {
  _db.run("DELETE FROM arbeitstage WHERE datum=?", [datum]);
  persistDb();
}
function dbGetBerichte() {
  const berichte = rowsToObjects(_db.exec("SELECT * FROM tagesberichte ORDER BY datum DESC"));
  for (const b of berichte) {
    const br = _db.exec("SELECT id FROM bilder WHERE bericht_datum=?", [b.datum]);
    b.bilder = br.length ? br[0].values.map(v => v[0]) : [];
  }
  return berichte;
}
function dbSaveBericht(b) {
  _db.run(
    `INSERT OR REPLACE INTO tagesberichte
     (datum, titel, taetigkeiten, lerninhalte, unterweisung, wetter, temperatur, temp_min, temp_max, niederschlag, ort, personen, werkzeuge, besonderheiten, stundenvon, stundenbis)
     VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
    [
      b.datum, b.titel || null, b.taetigkeiten || null, b.lerninhalte || null, b.unterweisung || null,
      b.wetter ?? null, b.temperatur ?? null, b.temp_min ?? null, b.temp_max ?? null, b.niederschlag ?? null,
      b.ort || null, b.personen || null, b.werkzeuge || null,
      b.besonderheiten || null, b.stundenvon || null, b.stundenbis || null,
    ]
  );
  persistDb();
}
function dbDeleteBericht(datum) {
  _db.run("DELETE FROM bilder WHERE bericht_datum=?", [datum]);
  _db.run("DELETE FROM tagesberichte WHERE datum=?", [datum]);
  persistDb();
}
function dbGetBild(id) {
  const r = rowsToObjects(_db.exec("SELECT * FROM bilder WHERE id=?", [id]));
  return r[0] || null;
}
function dbSaveBild(bild, berichtDatum) {
  _db.run(
    "INSERT OR REPLACE INTO bilder VALUES (?,?,?,?,?)",
    [bild.id, berichtDatum, bild.data, bild.thumb, bild.name || null]
  );
  persistDb();
}
function dbDeleteBild(id) {
  _db.run("DELETE FROM bilder WHERE id=?", [id]);
  persistDb();
}

// === Export/Import ===
function exportDbAsFile() {
  const bytes = _db.export();
  const blob = new Blob([bytes], { type: "application/x-sqlite3" });
  const url = URL.createObjectURL(blob);
  const now = new Date().toISOString().slice(0, 10);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ausbildung-${now}.db`;
  a.click();
  URL.revokeObjectURL(url);
}

async function importDbFromFile(file) {
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  if (_db) _db.close();
  _db = new SQL.Database(bytes);
  _db.exec(SCHEMA);
  const exported = _db.export();
  await idbSet(IDB_KEY_DB, exported);
  _dbMeta = { created: new Date().toISOString(), modified: new Date().toISOString() };
  await idbSet(IDB_KEY_META, _dbMeta);
}

async function resetDatabase() {
  if (_db) _db.close();
  _db = new SQL.Database();
  _db.exec(SCHEMA);
  const bytes = _db.export();
  _dbMeta = { created: new Date().toISOString(), modified: null };
  await idbSet(IDB_KEY_DB, bytes);
  await idbSet(IDB_KEY_META, _dbMeta);
}

// ============================================================
//  HELFER
// ============================================================
function fmtISO(d) { return d.toISOString().slice(0, 10); }
function parseISO(s) { return new Date(s + "T00:00:00"); }
function addMonths(d, n) { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; }
function daysBetween(a, b) { return Math.round((parseISO(fmtISO(b)) - parseISO(fmtISO(a))) / 86400000); }

// Prüfungstermine der zuständigen Stelle (Landwirtschaft BW):
// Winterprüfung: Februar · Sommerprüfung: Juli. Tag 15 als Platzhalter.
const AP_MONATE = [1, 6]; // Februar (Monatsindex 1) und Juli (Index 6)
const AP_TAG = 15;

function pruefungstermine(umDatum, jahreRange = 2) {
  if (!umDatum) return [];
  const jahr = umDatum.getFullYear();
  const arr = [];
  for (let y = jahr - jahreRange; y <= jahr + jahreRange; y++) {
    AP_MONATE.forEach(m => arr.push(new Date(y, m, AP_TAG)));
  }
  return arr.sort((a, b) => a - b);
}

// AP: letzter Termin, der ≤ Vertragsende + 14 Tage liegt.
// Vorzeitige Zulassung → der halbe Jahr früher liegende Termin.
function apTerminAuto(vertragsende, vorzeitig) {
  if (!vertragsende) return null;
  const termine = pruefungstermine(vertragsende, 2);
  const cutoff = new Date(vertragsende);
  cutoff.setDate(cutoff.getDate() + 14);
  let idx = -1;
  for (let i = termine.length - 1; i >= 0; i--) {
    if (termine[i] <= cutoff) { idx = i; break; }
  }
  if (idx < 0) return null;
  if (!vorzeitig) return termine[idx];
  return idx > 0 ? termine[idx - 1] : null;
}

// ZP: der Feb/Juli-Termin, der am nächsten am "idealen" Zeitpunkt
// (~40 % der effektiven Ausbildungsdauer) liegt.
function zpTerminAuto(start, effektiveDauerMonate) {
  if (!start) return null;
  const zielMonate = Math.round(effektiveDauerMonate * 14 / 36);
  const ziel = addMonths(start, zielMonate);
  const termine = pruefungstermine(ziel, 1);
  termine.sort((a, b) => Math.abs(ziel - a) - Math.abs(ziel - b));
  return termine[0];
}

// ============================================================
//  PHASEN-MATHEMATIK
// ============================================================
// Eine Phase ist ein Zeitabschnitt mit einheitlichen Eigenschaften.
// "ausbildung"-Phasen tragen zur effektiven Ausbildungszeit bei (skaliert mit
// Teilzeit), "unterbrechung"-Phasen schieben das Ende nach hinten.

function phasenSortiert(phasen) {
  return [...phasen].sort((a, b) => a.von.localeCompare(b.von) || a.id - b.id);
}

// Effektives Ende für die offene Phase: löst die "läuft noch"-Phase auf, indem
// die noch fehlende Restzeit zur Erreichung der Soll-Dauer berechnet wird.
function phasenMitEnden(phasen, regulaerDauer, verkuerzung = 0) {
  const sorted = phasenSortiert(phasen);
  const sollMonate = Math.max(6, regulaerDauer - (verkuerzung || 0));
  // Erst alle geschlossenen Phasen berechnen → wieviel "echte Ausbildungszeit"
  // (Vollzeit-äquivalent) ist schon erbracht?
  let erbrachtVZ = 0;
  const ergebnis = [];
  for (let i = 0; i < sorted.length; i++) {
    const p = { ...sorted[i] };
    if (p.bis) {
      // Geschlossene Phase
      const von = parseISO(p.von), bis = parseISO(p.bis);
      const monate = diffMonths(von, bis);
      p._dauerMonate = monate;
      if (p.typ === "ausbildung") {
        const tz = (p.teilzeit_prozent || 100) / 100;
        p._vzAequivalent = monate * tz;
        erbrachtVZ += p._vzAequivalent;
      } else {
        p._vzAequivalent = 0;
      }
    } else {
      // Offene Phase: "bis" wird berechnet
      if (p.typ === "ausbildung") {
        const tz = (p.teilzeit_prozent || 100) / 100;
        const restVZ = Math.max(0, sollMonate - erbrachtVZ);
        const restRealMonate = restVZ / tz; // Bei TZ entsprechend gestreckt
        const von = parseISO(p.von);
        const bis = addMonths(von, Math.round(restRealMonate));
        p._berechnetesEnde = fmtISO(bis);
        p._dauerMonate = restRealMonate;
        p._vzAequivalent = restVZ;
        erbrachtVZ += restVZ;
      } else {
        // Offene Unterbrechung — kann nicht berechnet werden, läuft "auf unbestimmte Zeit"
        p._berechnetesEnde = null;
        p._dauerMonate = null;
        p._vzAequivalent = 0;
      }
    }
    ergebnis.push(p);
  }
  return ergebnis;
}

// Vertragsende = Ende der letzten Ausbildungsphase
function vertragsendeAusPhasen(phasenMit) {
  for (let i = phasenMit.length - 1; i >= 0; i--) {
    const p = phasenMit[i];
    if (p.typ !== "ausbildung") continue;
    const ende = p.bis || p._berechnetesEnde;
    if (ende) return parseISO(ende);
  }
  return null;
}

// Aktive Phase am Stichtag
function aktivePhaseAm(phasenMit, datum) {
  const dStr = fmtISO(datum);
  for (const p of phasenMit) {
    const ende = p.bis || p._berechnetesEnde;
    if (p.von <= dStr && (!ende || ende >= dStr)) return p;
  }
  return null;
}

// Gesamte tatsächliche Ausbildungstage (für Fehltagsbudget) - Summe der
// Ausbildungsphasen-Dauer in Tagen, ggf. mit Teilzeit gewichtet
function tatsaechlicheAusbildungsTage(phasenMit, bisHeute = false) {
  let tage = 0;
  const heute = new Date();
  for (const p of phasenMit) {
    if (p.typ !== "ausbildung") continue;
    const von = parseISO(p.von);
    let bis = p.bis ? parseISO(p.bis) : (p._berechnetesEnde ? parseISO(p._berechnetesEnde) : null);
    if (!bis) continue;
    if (bisHeute && bis > heute) bis = heute;
    if (bis < von) continue;
    tage += daysBetween(von, bis);
  }
  return tage;
}

// Pauschale Fehltage aus allen Phasen summieren
function pauschaleFehltage(phasen) {
  let entsch = 0, unentsch = 0;
  for (const p of phasen) {
    entsch += p.pauschal_fehltage_e || 0;
    unentsch += p.pauschal_fehltage_u || 0;
  }
  return { entschuldigt: entsch, unentschuldigt: unentsch, summe: entsch + unentsch };
}

// Validierung: Lücken / Überlappungen finden
function phasenValidieren(phasen) {
  const sorted = phasenSortiert(phasen);
  const probleme = [];
  for (let i = 0; i < sorted.length - 1; i++) {
    const a = sorted[i], b = sorted[i + 1];
    if (!a.bis) {
      probleme.push({ typ: "offen_mitte", phasen: [a.id], text: "Eine offene Phase liegt vor weiteren Phasen — bitte 'bis' eintragen." });
      continue;
    }
    if (a.bis > b.von) {
      probleme.push({ typ: "ueberlappung", phasen: [a.id, b.id], text: `Phasen überlappen: ${a.bis} > ${b.von}` });
    } else if (a.bis < b.von) {
      const tage = daysBetween(parseISO(a.bis), parseISO(b.von));
      if (tage > 1) probleme.push({ typ: "luecke", phasen: [a.id, b.id], text: `Lücke von ${tage} Tagen zwischen ${a.bis} und ${b.von}` });
    }
  }
  return probleme;
}

function naechsterSeptember() {
  // Nächster 1. September ab heute (heute selbst zählt als "kommt noch")
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const y = heute.getFullYear();
  const sept = new Date(y, 8, 1); // Monat 8 = September (0-indexed)
  return fmtISO(heute <= sept ? sept : new Date(y + 1, 8, 1));
}
function diffMonths(from, to) {
  return (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth()) + (to.getDate() - from.getDate()) / 30;
}
function getKW(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const yStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - yStart) / 86400000 + 1) / 7);
}
function mondayOfKW(year, week) {
  const jan4 = new Date(year, 0, 4);
  const jan4Day = jan4.getDay() || 7;
  const mondayOfKW1 = new Date(jan4); mondayOfKW1.setDate(jan4.getDate() - jan4Day + 1);
  const monday = new Date(mondayOfKW1); monday.setDate(mondayOfKW1.getDate() + (week - 1) * 7);
  return monday;
}
const DE_MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const DE_MONTHS_SHORT = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const DE_WD = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const DE_WD_LONG = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
function fmtDE(d) { return d.toLocaleDateString("de-DE", { day: "2-digit", month: "short", year: "numeric" }); }
function fmtMonYear(iso) { if (!iso) return "–"; const [y, m] = iso.split("-"); return `${DE_MONTHS_SHORT[parseInt(m) - 1]} ${y}`; }

// Alter zum Stichtag
function alterZuStichtag(geburtsdatum, stichtag) {
  const geb = new Date(geburtsdatum); const st = new Date(stichtag);
  let alter = st.getFullYear() - geb.getFullYear();
  const hatteGeb = st.getMonth() > geb.getMonth() || (st.getMonth() === geb.getMonth() && st.getDate() >= geb.getDate());
  if (!hatteGeb) alter--;
  return alter;
}

// Tarifvergütung inkl. Mindestvergütung
function getTarifVerguetung(berufId, datum, lehrjahr, ausbildungsBeginn) {
  const beruf = BERUFE.find(b => b.id === berufId);
  if (!beruf) return 0;
  const lj = Math.max(1, Math.min(3, lehrjahr)) - 1;
  let betrag = beruf.tarife[0].lj[lj];
  for (let i = beruf.tarife.length - 1; i >= 0; i--) {
    if (datum >= new Date(beruf.tarife[i].ab)) { betrag = beruf.tarife[i].lj[lj]; break; }
  }
  const miavStichtag = ausbildungsBeginn || datum;
  for (let i = MINDESTVERGUETUNG.length - 1; i >= 0; i--) {
    if (miavStichtag >= new Date(MINDESTVERGUETUNG[i].ab)) {
      betrag = Math.max(betrag, MINDESTVERGUETUNG[i].lj[lj]); break;
    }
  }
  return betrag;
}

// Urlaub nach § 19 JArbSchG (bei Jugendlichen) oder Tarif
function getJahresurlaub(berufId, geburtsdatum, jahr) {
  const beruf = BERUFE.find(b => b.id === berufId);
  const tarifTage = beruf ? beruf.urlaub : 26;
  if (!geburtsdatum) return { tage: tarifTage, grund: "tarif" };
  const alter = alterZuStichtag(geburtsdatum, new Date(jahr, 0, 1));
  if (alter >= 18) return { tage: tarifTage, grund: "tarif" };
  if (alter >= 17) return { tage: Math.max(tarifTage, 21), grund: "u18" };
  if (alter >= 16) return { tage: Math.max(tarifTage, 23), grund: "u17" };
  return { tage: Math.max(tarifTage, 25), grund: "u16" };
}

// Prüfungszulassung nach § 43 / § 45 BBiG
function fruehesterPruefungstermin(endDate, vorzeitig = false) {
  if (!endDate) return null;
  const fiktivesEnde = vorzeitig ? addMonths(endDate, -6) : endDate;
  return addMonths(fiktivesEnde, -2);
}

// ============================================================
//  PERIODENBASIERTE VERGÜTUNGS- UND URLAUBSBERECHNUNG
//  (adaptiert aus bestehendem Ausbildungsrechner)
// ============================================================
// Phasen-bewusste Vergütungsperioden:
// - Pro Ausbildungsphase wird die Quote (TZ-Prozent) übernommen
// - Unterbrechungs-Phasen erzeugen Lücken (vergEff = 0, mit grund)
// - Lehrjahr-Wechsel basieren auf erbrachter VZ-Ausbildungszeit
function berechneVerguetungsUebersichtPhasen(cfg, phasenMit) {
  const { beruf_id, geburtsdatum, start_datum, verkuerzung_monate } = cfg;
  const startDate = parseISO(start_datum);
  if (isNaN(startDate)) return [];
  const verk = verkuerzung_monate || 0;
  const beruf = BERUFE.find(b => b.id === beruf_id);

  const ausbPhasen = phasenMit.filter(p => p.typ === "ausbildung");
  if (!ausbPhasen.length) return [];

  const perioden = [];
  let erbrachtVZ = 0; // monate VZ-äquivalent über alle vorigen Ausbildungsphasen

  for (const phase of phasenMit) {
    const phVon = parseISO(phase.von);
    const phBis = parseISO(phase.bis || phase._berechnetesEnde);
    if (!phBis || phBis <= phVon) continue;

    if (phase.typ === "unterbrechung") {
      perioden.push({
        von: phVon, bis: phBis, unterbrechung: true, grund: phase.grund || "Unterbrechung",
        lehrjahr: 0, quote: 0, vergVZ: 0, vergEff: 0,
        monateDauer: Math.round(diffMonths(phVon, phBis) * 10) / 10,
        urlaubTageJahr: 0, urlaubGrund: "Unterbrechung", urlaubAnteilig: 0,
      });
      continue;
    }

    const quote = phase.teilzeit_prozent || 100;
    const tz = quote / 100;

    // Innerhalb der Phase: Breakpoints für LJ-Wechsel, Tariftermine, Mindestvergütung-Stichtage, Jahreswechsel
    const breakpoints = new Set();

    // LJ-Wechsel: berechnen, wann erbrachtVZ + (zeitInPhaseInMonatenBisJetzt * tz) + verk eine Ganzzahl von 12 erreicht
    // Statt analytisch: wir schieben monatlich durch und prüfen
    for (let m = 1; m < diffMonths(phVon, phBis) + 1; m++) {
      const dat = addMonths(phVon, m);
      if (dat > phBis) break;
      const erbrPunkt = erbrachtVZ + m * tz + verk;
      const erbrPrev = erbrachtVZ + (m - 1) * tz + verk;
      const ljNeu = Math.floor(erbrPunkt / 12);
      const ljAlt = Math.floor(erbrPrev / 12);
      if (ljNeu !== ljAlt) breakpoints.add(fmtISO(dat));
    }
    if (beruf) beruf.tarife.forEach(t => {
      const d = new Date(t.ab);
      if (d > phVon && d < phBis) breakpoints.add(fmtISO(d));
    });
    MINDESTVERGUETUNG.forEach(m => {
      const d = new Date(m.ab);
      if (d > phVon && d < phBis) breakpoints.add(fmtISO(d));
    });
    for (let yr = phVon.getFullYear(); yr <= phBis.getFullYear() + 1; yr++) {
      const jan1 = new Date(yr, 0, 1);
      if (jan1 > phVon && jan1 < phBis) breakpoints.add(fmtISO(jan1));
    }

    const sorted = [...breakpoints].sort().map(s => parseISO(s));
    sorted.push(new Date(phBis));
    let periodStart = new Date(phVon);

    for (const bp of sorted) {
      if (bp <= periodStart) continue;
      const periodEnd = new Date(bp);
      const monateInPhase = diffMonths(phVon, periodStart);
      const erbrachtBisHier = erbrachtVZ + monateInPhase * tz + verk;
      const lehrjahr = Math.min(3, Math.floor(erbrachtBisHier / 12) + 1);
      const vergVZ = getTarifVerguetung(beruf_id, periodStart, lehrjahr, startDate);
      const vergEff = Math.round(vergVZ * tz);
      const monateDauer = Math.max(0, diffMonths(periodStart, periodEnd));
      const urlaubInfo = getJahresurlaub(beruf_id, geburtsdatum || null, periodStart.getFullYear());
      const urlaubAnteilig = Math.round((monateDauer / 12) * urlaubInfo.tage * tz * 2) / 2;
      perioden.push({
        von: new Date(periodStart), bis: new Date(periodEnd),
        unterbrechung: false, grund: null,
        lehrjahr, tzAktiv: tz < 1, quote, vergVZ, vergEff,
        monateDauer: Math.round(monateDauer * 10) / 10,
        urlaubTageJahr: urlaubInfo.tage, urlaubGrund: urlaubInfo.grund, urlaubAnteilig,
        betrieb: phase.betrieb || null, phaseId: phase.id,
      });
      periodStart = new Date(bp);
    }
    erbrachtVZ += diffMonths(phVon, phBis) * tz;
  }

  // Merge benachbarte gleiche Perioden (gleiche Quote, LJ, Tarif, Betrieb, kein Wechsel zu Unterbrechung)
  const merged = [];
  for (const p of perioden) {
    const last = merged[merged.length - 1];
    if (last && !last.unterbrechung && !p.unterbrechung
        && last.vergEff === p.vergEff && last.lehrjahr === p.lehrjahr
        && last.urlaubTageJahr === p.urlaubTageJahr && last.quote === p.quote
        && last.betrieb === p.betrieb) {
      last.bis = p.bis;
      last.monateDauer = Math.round(diffMonths(last.von, last.bis) * 10) / 10;
      last.urlaubAnteilig = Math.round((last.monateDauer / 12) * last.urlaubTageJahr * (last.quote/100) * 2) / 2;
    } else merged.push({ ...p });
  }
  return merged;
}

function berechneVerguetungsUebersicht(cfg, ende) {
  const { beruf_id, geburtsdatum, start_datum, teilzeit_prozent, verkuerzung_monate } = cfg;
  const startDate = parseISO(start_datum);
  if (isNaN(startDate) || isNaN(ende)) return [];

  const tzAktiv = teilzeit_prozent < 100;
  const quote = teilzeit_prozent;
  const verk = verkuerzung_monate || 0;

  const breakpoints = new Set();
  // Lehrjahr-Wechsel (verschoben um Verkürzung)
  for (let y = 1; y <= 5; y++) {
    const ljW = addMonths(startDate, 12 * y - verk);
    if (ljW > startDate && ljW < ende) breakpoints.add(fmtISO(ljW));
  }
  const beruf = BERUFE.find(b => b.id === beruf_id);
  if (beruf) beruf.tarife.forEach(t => {
    const d = new Date(t.ab);
    if (d > startDate && d < ende) breakpoints.add(fmtISO(d));
  });
  MINDESTVERGUETUNG.forEach(m => {
    const d = new Date(m.ab);
    if (d > startDate && d < ende) breakpoints.add(fmtISO(d));
  });
  for (let yr = startDate.getFullYear(); yr <= ende.getFullYear() + 1; yr++) {
    const jan1 = new Date(yr, 0, 1);
    if (jan1 > startDate && jan1 < ende) breakpoints.add(fmtISO(jan1));
  }

  const sorted = [...breakpoints].sort().map(s => parseISO(s));
  sorted.push(new Date(ende));
  let periodStart = new Date(startDate);
  const perioden = [];

  for (const bp of sorted) {
    if (bp <= periodStart) continue;
    const periodEnd = new Date(bp);
    const monateAbBeginn = diffMonths(startDate, periodStart) + verk;
    const lehrjahr = Math.min(3, Math.floor(monateAbBeginn / 12) + 1);
    const vergVZ = getTarifVerguetung(beruf_id, periodStart, lehrjahr, startDate);
    const vergEff = Math.round(vergVZ * (quote / 100));
    const monateDauer = Math.max(0, diffMonths(periodStart, periodEnd));
    const urlaubInfo = getJahresurlaub(beruf_id, geburtsdatum || null, periodStart.getFullYear());
    const urlaubAnteilig = Math.round((monateDauer / 12) * urlaubInfo.tage * (quote/100) * 2) / 2;
    perioden.push({
      von: new Date(periodStart), bis: new Date(periodEnd),
      lehrjahr, tzAktiv, quote, vergVZ, vergEff,
      monateDauer: Math.round(monateDauer * 10) / 10,
      urlaubTageJahr: urlaubInfo.tage, urlaubGrund: urlaubInfo.grund, urlaubAnteilig,
    });
    periodStart = new Date(bp);
  }

  // Merge gleicher Perioden
  const merged = [];
  for (const p of perioden) {
    const last = merged[merged.length - 1];
    if (last && last.vergEff === p.vergEff && last.lehrjahr === p.lehrjahr && last.urlaubTageJahr === p.urlaubTageJahr) {
      last.bis = p.bis;
      last.monateDauer = Math.round(diffMonths(last.von, last.bis) * 10) / 10;
      last.urlaubAnteilig = Math.round((last.monateDauer / 12) * last.urlaubTageJahr * (last.quote/100) * 2) / 2;
    } else merged.push({ ...p });
  }
  return merged;
}

// ============================================================
//  KENNZAHLEN
// ============================================================
function computeKennzahlen(cfg, tage, phasen) {
  if (!cfg || !cfg.start_datum) return null;
  // Phasen mit berechneten Enden (offene Phase wird aufgelöst)
  const phasenMit = phasen?.length
    ? phasenMitEnden(phasen, cfg.regulaer_dauer_monate, cfg.verkuerzung_monate)
    : phasenMitEnden(
        [{ id: -1, von: cfg.start_datum, bis: null, typ: "ausbildung", teilzeit_prozent: cfg.teilzeit_prozent || 100 }],
        cfg.regulaer_dauer_monate, cfg.verkuerzung_monate
      );

  const start = parseISO(cfg.start_datum);
  const ende = vertragsendeAusPhasen(phasenMit) || addMonths(start, cfg.regulaer_dauer_monate);
  const heute = new Date();

  // Aktuelle Phase
  const aktPhase = aktivePhaseAm(phasenMit, heute);
  const tz = (aktPhase?.teilzeit_prozent ?? cfg.teilzeit_prozent ?? 100) / 100;
  const dauerFaktor = Math.min(1 / Math.max(tz, 0.01), 1.5);
  const effektiveDauer = Math.max(6, cfg.regulaer_dauer_monate - (cfg.verkuerzung_monate || 0));
  const dauer = Math.round(diffMonths(start, ende));

  const kTageGes = Math.max(1, daysBetween(start, ende));
  const kTageVorbei = Math.max(0, Math.min(kTageGes, daysBetween(start, heute)));
  const progress = Math.round((kTageVorbei / kTageGes) * 100);

  // Fehltage-Budget aus tatsächlichen Ausbildungstagen (ohne Unterbrechungen)
  const ausbildungsTageGes = tatsaechlicheAusbildungsTage(phasenMit, false);
  const atVollzeit = Math.round((ausbildungsTageGes / 7) * 5);
  // gewichtetes Mittel der Teilzeit-Quoten über alle Ausbildungsphasen
  const phasenAusb = phasenMit.filter(p => p.typ === "ausbildung");
  const tzMittel = phasenAusb.length
    ? phasenAusb.reduce((s, p) => s + ((p.teilzeit_prozent || 100) / 100) * (p._dauerMonate || 0), 0)
      / Math.max(0.001, phasenAusb.reduce((s, p) => s + (p._dauerMonate || 0), 0))
    : tz;
  const atGes = Math.round(atVollzeit * tzMittel);
  const fehltageSoft = Math.round(atGes * 0.10);
  const fehltageHart = Math.round(atGes * 0.15);

  const counts = {};
  Object.keys(STATUS).forEach(k => counts[k] = 0);
  Object.values(tage).forEach(t => { if (counts[t.status] !== undefined) counts[t.status]++; });
  // Pauschal-Fehltage aus Phasen dazuaddieren (nur Krank-Kategorie als Sammelposten)
  const pf = pauschaleFehltage(phasen || []);
  const krank = counts.krank + pf.summe;
  const urlaubGenommen = counts.urlaub;
  const anwesend = counts.anwesend + counts.berufsschule + counts.lerntag + counts.ueba;

  // Aktuelles Lehrjahr basiert auf bereits erbrachter VZ-Ausbildungszeit + Verkürzung
  const erbrachtVZ = phasenMit
    .filter(p => p.typ === "ausbildung" && (p.bis ? parseISO(p.bis) <= heute : true))
    .reduce((s, p) => {
      const von = parseISO(p.von);
      const bis = p.bis ? parseISO(p.bis) : heute;
      const eff = bis < heute ? bis : heute;
      if (eff < von) return s;
      const monate = diffMonths(von, eff);
      return s + monate * ((p.teilzeit_prozent || 100) / 100);
    }, 0);
  const aktLehrjahr = Math.min(3, Math.max(1, Math.floor((erbrachtVZ + (cfg.verkuerzung_monate || 0)) / 12) + 1));

  // Aktuelle Wochenstunden basieren auf aktiver Phase
  const wochenstunden = +(cfg.vollzeit_wochenstunden * tz).toFixed(1);

  // Vergütungs-Übersicht (jetzt phasen-bewusst!)
  const perioden = berechneVerguetungsUebersichtPhasen(cfg, phasenMit);
  const verguetungGesamt = perioden.reduce((s, p) => s + p.vergEff * p.monateDauer, 0);
  const urlaubGesamt = Math.round(perioden.reduce((s, p) => s + p.urlaubAnteilig, 0));

  // Aktuelle Vergütung (heute)
  const aktPeriode = perioden.find(p => heute >= p.von && heute < p.bis) || perioden[perioden.length - 1];
  const aktVerg = aktPeriode ? aktPeriode.vergEff : 0;

  // Prüfungstermin-Berechnung
  const fruehPruef = fruehesterPruefungstermin(ende, false);
  const fruehPruefVorzeitig = fruehesterPruefungstermin(ende, true);

  const zpAutoDate = zpTerminAuto(start, dauer);
  const apAutoDate = apTerminAuto(ende, cfg.vorzeitige_zulassung);

  const zpManuell = !!cfg.zp_monat;
  const apManuell = !!cfg.ap_monat;
  const zpDate = zpManuell ? parseISO(cfg.zp_monat + "-15") : zpAutoDate;
  const apDate = apManuell ? parseISO(cfg.ap_monat + "-15") : apAutoDate;

  let naechsterMeilenstein = null;
  if (zpDate > heute) naechsterMeilenstein = { titel: "Zwischenprüfung", datum: zpDate, tage: daysBetween(heute, zpDate), auto: !zpManuell };
  else if (apDate > heute) naechsterMeilenstein = { titel: "Abschlussprüfung", datum: apDate, tage: daysBetween(heute, apDate), auto: !apManuell };
  else if (ende > heute) naechsterMeilenstein = { titel: "Ende der Ausbildung", datum: ende, tage: daysBetween(heute, ende), auto: false };

  return {
    tz, tzMittel, dauerFaktor, dauer, effektiveDauer, wochenstunden,
    start, ende, heute, kTageGes, kTageVorbei, progress,
    atVollzeit, atGes, fehltageSoft, fehltageHart, ausbildungsTageGes,
    counts, krank, urlaubGenommen, anwesend, pauschalFehltage: pf,
    aktLehrjahr, naechsterMeilenstein,
    perioden, verguetungGesamt, urlaubGesamt, aktVerg, aktPeriode,
    fruehPruef, fruehPruefVorzeitig,
    zpDate, apDate, zpManuell, apManuell,
    phasenMit, aktPhase,
  };
}

// ============================================================
//  APP
// ============================================================
function App() {
  const [loaded, setLoaded] = useState(false);
  const [dbError, setDbError] = useState(null);
  const [dbStatus, setDbStatus] = useState(null);
  const [config, setConfig] = useState(null);
  const [tage, setTage] = useState({});
  const [berichte, setBerichte] = useState([]);
  const [phasen, setPhasen] = useState([]);
  const [tab, setTab] = useState("uebersicht");
  const [saveStatus, setSaveStatus] = useState("idle");
  const [pendingNav, setPendingNav] = useState(null);
  const [showWelcome, setShowWelcome] = useState(false);
  const [statusBannerVisible, setStatusBannerVisible] = useState(false);
  const [persistInfo, setPersistInfo] = useState({ backend: "unknown", state: null, modified: null });

  async function ladeDaten() {
    setConfig(dbGetConfig());
    setTage(dbGetTage());
    setBerichte(dbGetBerichte());
    setPhasen(dbGetPhasen());
  }

  useEffect(() => {
    (async () => {
      try {
        const status = await initDatabase();
        setDbStatus(status);
        setPersistInfo(p => ({ ...p, backend: status.backend, modified: status.meta?.modified || null }));
        await ladeDaten();
        // Wenn keine Daten vorhanden sind → Willkommens-Screen mit Import-Option
        if (!status.hatDaten) {
          setShowWelcome(true);
        } else {
          // Bestehende DB → Status-Banner kurz einblenden
          setStatusBannerVisible(true);
          setTimeout(() => setStatusBannerVisible(false), 4500);
        }
      } catch (e) {
        console.error(e);
        setDbError(e.message || "Datenbank konnte nicht geladen werden");
      }
      setLoaded(true);
    })();

    const unsub = onPersistStatus(s => {
      setPersistInfo(p => ({
        ...p,
        state: s.state,
        message: s.message || null,
        modified: s.modified || p.modified,
      }));
    });
    const onBeforeUnload = (e) => {
      if (_pendingSave || _storageBackend === "none") {
        e.preventDefault();
        e.returnValue = "Es gibt ungespeicherte Änderungen.";
        return e.returnValue;
      }
    };
    window.addEventListener("beforeunload", onBeforeUnload);
    return () => { unsub(); window.removeEventListener("beforeunload", onBeforeUnload); };
  }, []);

  const flash = () => { setSaveStatus("saved"); setTimeout(() => setSaveStatus("idle"), 1400); };

  function saveConfig(c) {
    setSaveStatus("saving");
    dbSaveConfig(c);
    setConfig(c);
    // Wenn dies das Ersterstellen einer Config ist, lege gleich eine erste Phase an
    const existingPhasen = dbGetPhasen();
    if (!existingPhasen.length && c.start_datum) {
      dbAddPhase({
        von: c.start_datum, bis: null, typ: "ausbildung",
        teilzeit_prozent: c.teilzeit_prozent || 100,
        anmerkung: "Initial-Phase aus Onboarding",
      });
    }
    setPhasen(dbGetPhasen());
    flash();
  }
  function reloadPhasen() { setPhasen(dbGetPhasen()); flash(); }
  function savePhase(id, p) { setSaveStatus("saving"); dbUpdatePhase(id, p); reloadPhasen(); }
  function addPhase(p) { setSaveStatus("saving"); dbAddPhase(p); reloadPhasen(); }
  function deletePhase(id) { dbDeletePhase(id); setPhasen(dbGetPhasen()); }

  function saveTag(datum, data) {
    setSaveStatus("saving");
    const e = { datum, ...data };
    dbSaveTag(datum, data);
    setTage(p => ({ ...p, [datum]: e }));
    flash();
  }
  function deleteTag(datum) {
    dbDeleteTag(datum);
    setTage(p => { const n = { ...p }; delete n[datum]; return n; });
  }
  function saveBericht(b) {
    setSaveStatus("saving");
    dbSaveBericht(b);
    setBerichte(p => [...p.filter(x => x.datum !== b.datum), b].sort((a, b) => b.datum.localeCompare(a.datum)));
    flash();
  }
  function deleteBericht(datum) {
    dbDeleteBericht(datum);
    setBerichte(p => p.filter(b => b.datum !== datum));
  }

  function openBerichtForDate(datum) { setPendingNav({ target: "berichte", datum }); setTab("berichte"); }
  function openTagForDate(datum) { setPendingNav({ target: "kalender", datum }); setTab("kalender"); }
  const berichteByDatum = useMemo(() => {
    const m = {}; berichte.forEach(b => (m[b.datum] = b)); return m;
  }, [berichte]);

  const k = useMemo(() => computeKennzahlen(config, tage, phasen), [config, tage, phasen]);
  const beratungsModus = config?.modus === "beratung";

  if (!loaded) return <Loading />;
  if (dbError) return <DbError message={dbError} />;
  if (showWelcome && !config) return <WelcomeScreen status={dbStatus}
    onNeu={() => setShowWelcome(false)}
    onImport={async (file) => {
      try {
        await importDbFromFile(file);
        window.location.reload();
      } catch (e) {
        alert("Import fehlgeschlagen: " + (e.message || e));
      }
    }} />;
  if (!config) return <Onboarding onSave={saveConfig} />;

  return (
    <div className="min-h-screen" style={{ background: "#f7f4ec", fontFamily: "'IBM Plex Sans', system-ui, sans-serif", color: "#1a1a1a" }}>
      <Fonts />
      <PrintStyles />
      {statusBannerVisible && dbStatus && <DbStatusBanner status={dbStatus} onClose={() => setStatusBannerVisible(false)} />}
      <Header config={config} saveStatus={saveStatus} persistInfo={persistInfo} />
      <Nav tab={tab} setTab={setTab} beratungsModus={beratungsModus} />
      <main className="max-w-6xl mx-auto px-4 sm:px-6 pb-16">
        {tab === "uebersicht"    && <Uebersicht config={config} tage={tage} k={k} berichte={berichte} phasen={phasen} />}
        {tab === "kalender"      && !beratungsModus && <Kalender config={config} tage={tage} berichteByDatum={berichteByDatum}
                                              saveTag={saveTag} deleteTag={deleteTag}
                                              pendingNav={pendingNav} clearPendingNav={() => setPendingNav(null)}
                                              onOpenBericht={openBerichtForDate} />}
        {tab === "berichte"      && !beratungsModus && <Berichte config={config} berichte={berichte} tage={tage}
                                              saveBericht={saveBericht} deleteBericht={deleteBericht}
                                              pendingNav={pendingNav} clearPendingNav={() => setPendingNav(null)}
                                              onOpenTag={openTagForDate} />}
        {tab === "statistik"     && <Statistik config={config} tage={tage} k={k} berichte={berichte} phasen={phasen} />}
        {tab === "einstellungen" && <Einstellungen config={config} saveConfig={saveConfig}
                                                   phasen={phasen} addPhase={addPhase}
                                                   savePhase={savePhase} deletePhase={deletePhase} />}
      </main>
      <Footer />
    </div>
  );
}

function DbError({ message }) {
  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{ background: "#f7f4ec" }}>
      <Fonts />
      <div className="paper max-w-md p-6">
        <div className="flex items-center gap-2 mb-3 text-[#b04545]">
          <AlertTriangle size={20} />
          <h2 className="font-display text-xl" style={{ fontWeight: 600 }}>Datenbank-Fehler</h2>
        </div>
        <p className="text-sm text-[#4a4a4a] mb-4">{message}</p>
        <button className="btn-primary" onClick={() => window.location.reload()}>Neu laden</button>
      </div>
    </div>
  );
}

          Es wurde keine bestehende Datenbank gefunden. Du kannst neu anfangen oder eine zuvor

          <button onClick={() => fileInput.current?.click()}

              <Upload size={22} style={{ color: "#6b6b6b", marginTop: 2 }} />

                <div className="font-medium text-base mb-1">Bestehende .db-Datei importieren</div>
                <div className="text-sm text-[#6b6b6b] leading-snug">

          <input ref={fileInput} type="file" accept=".db,.sqlite,.sqlite3,application/x-sqlite3" className="hidden"

        <div className="mt-6 pt-4 border-t text-[10px] text-[#9a9a9a] font-mono" style={{ borderColor: "#efece2" }}>

// ============================================================
//  STATUS-BANNER (DB wurde gefunden)
// ============================================================
function DbStatusBanner({ status, onClose }) {
  const { counts, meta, bytes } = status;
  const geaendert = meta?.modified ? new Date(meta.modified) : null;
  const minAgo = geaendert ? Math.round((Date.now() - geaendert.getTime()) / 60000) : null;
  const zeit = !geaendert ? "neu" :
    minAgo < 1 ? "gerade eben" :
    minAgo < 60 ? `vor ${minAgo} Min.` :
    minAgo < 1440 ? `vor ${Math.round(minAgo / 60)} Std.` :
    geaendert.toLocaleDateString("de-DE");
  const parts = [];
  if (counts.phasen > 0) parts.push(`${counts.phasen} Phase${counts.phasen !== 1 ? "n" : ""}`);
  if (counts.berichte > 0) parts.push(`${counts.berichte} Bericht${counts.berichte !== 1 ? "e" : ""}`);
  if (counts.tage > 0) parts.push(`${counts.tage} Kalendertag${counts.tage !== 1 ? "e" : ""}`);
  const zusammenfassung = parts.length ? parts.join(" · ") : "Stammdaten vorhanden";
  const kb = Math.round(bytes / 1024);
  return (
    <div className="fixed top-3 left-1/2 -translate-x-1/2 z-40 no-print" style={{ animation: "slideDown 0.3s ease-out" }}>
      <div className="flex items-center gap-2 px-4 py-2 rounded-sm shadow-sm text-sm"
           style={{ background: "#e8f0e0", border: "1px solid #c9dcc1", color: "#2d5a3d" }}>
        <Database size={14} />
        <span className="font-medium">SQLite-DB geladen</span>
        <span className="text-[#6b6b6b] text-xs">· {zusammenfassung}</span>
        <span className="text-[#9a9a9a] text-xs font-mono">· {kb} KB · {zeit}</span>
        <button onClick={onClose} className="ml-2 p-0.5 hover:bg-[#d0e0c0] rounded-sm"><X size={11} /></button>
      </div>
      <style>{`@keyframes slideDown { from { opacity: 0; transform: translate(-50%, -12px); } to { opacity: 1; transform: translate(-50%, 0); } }`}</style>
    </div>
  );
}

function PrintStyles() {
  return <style>{`
    @media print {
      body { background: #fff !important; }
      nav, header, footer, .no-print { display: none !important; }
      .print-area { display: block !important; }
      .print-page { page-break-after: always; padding: 1.5cm 1.2cm; background: #fff !important; }

      @page { size: A4; margin: 0; }
    }
    @media screen {
      .print-area { display: none; }
    }
  `}</style>;
}

function Onboarding({ onSave }) {
  const [step, setStep] = useState(0);
  const [form, setForm] = useState({
    ...DEFAULT_CONFIG,
    start_datum: naechsterSeptember(),
    modus: "vollstaendig",
  });
  const upd = (p, v) => setForm(prev => {
    const c = JSON.parse(JSON.stringify(prev));
    const parts = p.split("."); let cur = c;
    for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
    cur[parts[parts.length - 1]] = v;
    return c;
  });

  const istBeratung = form.modus === "beratung";

  const allSteps = [
    { id: "modus", title: "Wie möchtest du das Tool nutzen?", body: <ModusAuswahl form={form} upd={upd} /> },
    { id: "name", title: istBeratung ? "Beratungsfall anlegen" : "Willkommen", body: (
      <div className="space-y-4">
        <p className="text-[#4a4a4a] leading-relaxed">
          {istBeratung
            ? "Lege einen Namen oder eine Bezeichnung für diesen Fall an (z. B. Aktenzeichen oder Initialen)."
            : "Dieses Dashboard begleitet durch die Gärtner-Ausbildung. Vergütung und Urlaub werden automatisch nach den aktuellen Tarifen und dem gesetzlichen Rahmen berechnet."
          }
        </p>
        <Field label={istBeratung ? "Bezeichnung / Name" : "Name (optional)"}>
          <input className="input-base" value={form.name} onChange={e => upd("name", e.target.value)} />
        </Field>
      </div>
    )},
    { id: "fachrichtung", title: "Fachrichtung & Start", body: (
      <div className="space-y-4">
        <Field label="Fachrichtung">
          <select className="input-base" value={form.beruf_id} onChange={e => upd("beruf_id", e.target.value)}>
            {BERUFE.map(b => <option key={b.id} value={b.id}>{b.label}</option>)}
          </select>
        </Field>
        <Field label="Ausbildungsbeginn">
          <input type="date" className="input-base" value={form.start_datum} onChange={e => upd("start_datum", e.target.value)} />
        </Field>
        <Field label="Geburtsdatum (optional)" hint="Für exakte Urlaubsberechnung nach § 19 JArbSchG bei Jugendlichen.">
          <input type="date" className="input-base" value={form.geburtsdatum} onChange={e => upd("geburtsdatum", e.target.value)} />
        </Field>
        {istBeratung && (
          <div className="text-xs p-2.5 rounded-sm leading-relaxed" style={{ background: "#f7f4ec", border: "1px solid #e5e0d4", color: "#4a4a4a" }}>
            Im nächsten Schritt nach dem Speichern kannst du in den Einstellungen Phasen
            (Teilzeit ab x, Unterbrechungen, Betriebswechsel) und bisherige Fehltage eintragen.
          </div>
        )}
      </div>
    )},
    { id: "anpassung", title: "Anpassungen", body: <AnpassungsPanel form={form} upd={upd} />, voll: true },
    { id: "pruefung", title: "Berufsschule & Prüfungen", body: <PruefungsPanel form={form} upd={upd} />, voll: true },
    { id: "standort", title: "Standort (optional)", body: (
      <div className="space-y-4">
        <p className="text-xs text-[#6b6b6b] leading-relaxed">
          Der Standort wird für den automatischen Wetter-Connector im Berichtsheft verwendet (Open-Meteo,
          keine Anmeldung nötig). Kann auch später ergänzt werden.
        </p>
        <StandortFeld form={form} upd={upd} />
      </div>
    ), voll: true },
  ];
  const steps = allSteps.filter(s => !s.voll || !istBeratung);

  // Wenn der Modus-Wechsel die Schrittliste verkürzt hat, kappe den step-Index
  const safeStep = Math.min(step, steps.length - 1);
  const cur = steps[safeStep], last = safeStep === steps.length - 1;
  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{ background: "#f7f4ec" }}>
      <Fonts />
      <div className="paper max-w-xl w-full p-8 sm:p-10">
        <div className="flex items-center gap-2 mb-6">
          <Sprout className="text-[#2d5a3d]" size={22} />
          <div className="text-xs uppercase tracking-widest text-[#6b6b6b]">Schritt {safeStep + 1} von {steps.length}</div>
        </div>
        <h2 className="font-display text-3xl mb-6" style={{ fontWeight: 600 }}>{cur.title}</h2>
        {cur.body}
        <div className="flex justify-between items-center gap-3 mt-8 pt-6" style={{ borderTop: "1px solid #e5e0d4" }}>
          {safeStep > 0 ? <button className="btn-ghost" onClick={() => setStep(safeStep - 1)}>Zurück</button> : <span />}
          {last ? <button className="btn-primary" onClick={() => onSave(form)}>Dashboard starten →</button>
                : <button className="btn-primary" onClick={() => setStep(safeStep + 1)}>Weiter →</button>}
        </div>
      </div>
    </div>
  );
}

function AnpassungsPanel({ form, upd }) {
  const tz = form.teilzeit_prozent / 100;
  const dauerFaktor = Math.min(1 / tz, 1.5);
  const effektiveDauer = Math.max(6, form.regulaer_dauer_monate - (form.verkuerzung_monate || 0));
  const dauer = Math.round(effektiveDauer * dauerFaktor);
  const wochenstunden = +(form.vollzeit_wochenstunden * tz).toFixed(1);

  // Live-Vorschau der Prüfungstermine
  let ende = null, zpDate = null, apDate = null;
  if (form.start_datum) {
    const start = parseISO(form.start_datum);
    ende = addMonths(start, dauer);
    zpDate = zpTerminAuto(start, dauer);
    apDate = apTerminAuto(ende, form.vorzeitige_zulassung);
  }

  return (
    <div className="space-y-5">
      {/* Verkürzung § 8 BBiG */}
      <div>
        <label className="label-base">Verkürzung (§ 8 BBiG)</label>
        <select className="input-base" value={form.verkuerzung_monate}
          onChange={e => upd("verkuerzung_monate", parseInt(e.target.value))}>
          <option value="0">Keine Verkürzung</option>
          <option value="6">6 Monate (z. B. Realschulabschluss)</option>
          <option value="12">12 Monate (z. B. Fachhochschulreife / Abitur)</option>
          <option value="18">18 Monate (in Ausnahmefällen)</option>
        </select>
        <p className="text-xs text-[#6b6b6b] mt-1">
          Auf gemeinsamen Antrag von Betrieb und Azubi. Die Kammer bzw. das RP entscheidet im Einzelfall.
        </p>
      </div>

      {/* Teilzeit § 7a BBiG */}
      <div>
        <label className="label-base">Teilzeit (§ 7a BBiG)</label>
        <div className="flex items-center gap-4">
          <input type="range" min="50" max="100" step="5" value={form.teilzeit_prozent}
            onChange={e => upd("teilzeit_prozent", parseInt(e.target.value))} className="flex-1 accent-[#2d5a3d]" />
          <div className="font-display text-2xl w-20 text-right" style={{ color: "#2d5a3d", fontWeight: 600 }}>
            {form.teilzeit_prozent}%
          </div>
        </div>
        <p className="text-xs text-[#6b6b6b] mt-1">
          100 % = Vollzeit. Dauer verlängert sich umgekehrt proportional (50 % = doppelt), max. 1,5-fach (§ 7a BBiG).
        </p>
      </div>

      {/* Vorzeitige Zulassung § 45 BBiG */}
      <label className="flex items-start gap-3 p-3 rounded-sm cursor-pointer" style={{ background: "#fcfaf3", border: "1px solid #e5e0d4" }}>
        <input type="checkbox" checked={form.vorzeitige_zulassung}
          onChange={e => upd("vorzeitige_zulassung", e.target.checked)}
          className="mt-0.5 accent-[#2d5a3d]" />
        <div>
          <div className="text-sm font-medium">Vorzeitige Zulassung zur Abschlussprüfung (§ 45 BBiG)</div>
          <div className="text-xs text-[#6b6b6b] mt-0.5">
            Nur bei guter Prognose: Zwischenprüfung&nbsp;Ø <strong>mindestens überdurchschnittlich</strong>.
            AP findet dann einen Prüfungstermin früher (≈ 6 Monate) statt.
          </div>
        </div>
      </label>

      {/* Live-Vorschau */}
      <div className="p-4 rounded-sm" style={{ background: "#f7f4ec", border: "1px solid #e5e0d4" }}>
        <div className="text-xs uppercase tracking-widest text-[#6b6b6b] mb-3">Live-Vorschau</div>
        <div className="grid grid-cols-2 gap-y-2 text-sm">
          <div className="text-[#6b6b6b]">Effektive Dauer</div>
          <div className="font-mono text-right">{dauer} Monate{form.verkuerzung_monate > 0 && ` (−${form.verkuerzung_monate})`}{tz < 1 && ` (×${dauerFaktor.toFixed(2)})`}</div>
          <div className="text-[#6b6b6b]">Wochenstunden</div>
          <div className="font-mono text-right">{wochenstunden} h</div>
          {ende && <>
            <div className="text-[#6b6b6b]">Vertragsende</div>
            <div className="font-mono text-right">{fmtDE(ende)}</div>
            <div className="text-[#6b6b6b]">Zwischenprüfung</div>
            <div className="font-mono text-right">{zpDate ? `${DE_MONTHS_SHORT[zpDate.getMonth()]} ${zpDate.getFullYear()}` : "–"}</div>
            <div className="text-[#6b6b6b]">Abschlussprüfung</div>
            <div className="font-mono text-right">{apDate ? `${DE_MONTHS_SHORT[apDate.getMonth()]} ${apDate.getFullYear()}` : "–"}</div>
          </>}
        </div>
      </div>
    </div>
  );
}

function PruefungsPanel({ form, upd }) {
  // Effektive Dauer für ZP-Mitte-Schätzung (vor Teilzeit-Strecken)
  const tz = form.teilzeit_prozent / 100;
  const dauerFaktor = Math.min(1 / tz, 1.5);
  const effektiveDauer = Math.max(6, form.regulaer_dauer_monate - (form.verkuerzung_monate || 0));
  const dauer = Math.round(effektiveDauer * dauerFaktor);
  const start = form.start_datum ? parseISO(form.start_datum) : null;
  const ende = start ? addMonths(start, dauer) : null;
  // ZP: nächstgelegener Feb/Juli-Termin zur Ausbildungs-Mitte.
  // AP: letzter Feb/Juli-Termin ≤ Vertragsende + 14 Tage. Mit vorzeitiger Zulassung:
  // ein Termin zuvor (~6 Monate früher).
  const zpAuto = zpTerminAuto(start, dauer);
  const apAuto = apTerminAuto(ende, form.vorzeitige_zulassung);
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;

  // Auto-Vorbelegung: setzt Vorschlag als Wert, merkt sich den zuletzt gesetzten
  // Vorschlag per Ref. Wenn der User manuell einen anderen Wert einträgt,
  // wird nicht mehr überschrieben. Beim Mount wird der Ref initialisiert, falls
  // der bestehende Wert dem aktuellen Auto-Vorschlag entspricht.
  const prevZpRef = useRef(zpAuto && form.zp_monat === fmt(zpAuto) ? form.zp_monat : null);
  const prevApRef = useRef(apAuto && form.ap_monat === fmt(apAuto) ? form.ap_monat : null);
  useEffect(() => {
    const zpNeu = zpAuto ? fmt(zpAuto) : null;
    const apNeu = apAuto ? fmt(apAuto) : null;
    if (zpNeu && (!form.zp_monat || form.zp_monat === prevZpRef.current)) {
      if (form.zp_monat !== zpNeu) upd("zp_monat", zpNeu);
    }
    prevZpRef.current = zpNeu;
    if (apNeu && (!form.ap_monat || form.ap_monat === prevApRef.current)) {
      if (form.ap_monat !== apNeu) upd("ap_monat", apNeu);
    }
    prevApRef.current = apNeu;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [zpAuto?.getTime(), apAuto?.getTime()]);

  return (
    <div className="space-y-4">
      <Field label="Berufsschul-Modus">
        <select className="input-base" value={form.berufsschule_modus} onChange={e => upd("berufsschule_modus", e.target.value)}>
          <option value="regulaer">Regulärer Berufsschulbesuch</option>
          <option value="lerntag">Lerntag statt Berufsschule (§ 14 BBiG)</option>
          <option value="keine">Keine Berufsschule</option>
        </select>
      </Field>
      {form.berufsschule_modus === "keine" && (
        <div className="text-xs p-2.5 rounded-sm leading-relaxed" style={{ background: "#fdf7e3", border: "1px solid #e8d9a8", color: "#7a5a1a" }}>
          <AlertTriangle size={12} className="inline mr-1 -mt-0.5" />
          Auch ohne Berufsschulbesuch sind Zwischen- und Abschlussprüfung (jeweils schriftlich&nbsp;+&nbsp;praktisch) für alle Auszubildenden verpflichtend.
        </div>
      )}
      <p className="text-xs text-[#6b6b6b] leading-relaxed">
        Prüfungstermine sind immer entweder <strong>Winter (Februar)</strong> oder <strong>Sommer (Juli)</strong>.
        Die Vorschläge orientieren sich am Verlauf und der 2-Wochen-Regel vor Vertragsende. Sobald der
        konkrete Termin von der zuständigen Stelle bekannt ist, einfach überschreiben.
      </p>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Zwischenprüfung" hint={form.zp_monat === (zpAuto && fmt(zpAuto)) ? "aus Verlauf berechnet" : "manuell gesetzt"}>
          <input type="month" className="input-base" value={form.zp_monat || ""}
            onChange={e => upd("zp_monat", e.target.value)} />
        </Field>
        <Field label="Abschlussprüfung" hint={form.ap_monat === (apAuto && fmt(apAuto)) ? "aus Verlauf berechnet" : "manuell gesetzt"}>
          <input type="month" className="input-base" value={form.ap_monat || ""}
            onChange={e => upd("ap_monat", e.target.value)} />
        </Field>
      </div>
    </div>
  );
}

// (alte Kompatibilität – wird nicht mehr genutzt, bleibt aber für evtl. Referenzen)
function TeilzeitPanel({ form, upd }) { return <AnpassungsPanel form={form} upd={upd} />; }

function StandortFeld({ form, upd }) {
  const [suche, setSuche] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [treffer, setTreffer] = useState([]);

  async function geocode() {
    if (!suche.trim()) return;
    setLoading(true); setError(""); setTreffer([]);
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(suche)}&count=8&language=de&format=json`);
      const data = await r.json();
      const res = data.results || [];
      if (!res.length) setError("Ort nicht gefunden");
      else if (res.length === 1) waehle(res[0]);
      else setTreffer(res);
    } catch { setError("Suche fehlgeschlagen"); }
    setLoading(false);
  }

  function waehle(g) {
    const teile = [g.name];
    if (g.admin2 && g.admin2 !== g.name) teile.push(g.admin2);
    if (g.admin1) teile.push(g.admin1);
    if (g.country_code && g.country_code !== "DE") teile.push(g.country_code);
    const label = teile.join(", ");
    upd("standort_name", label);
    upd("standort_lat", g.latitude);
    upd("standort_lng", g.longitude);
    setSuche("");
    setTreffer([]);
  }

  function entfernen() {
    upd("standort_name", null);
    upd("standort_lat", null);
    upd("standort_lng", null);
    setTreffer([]);
    setSuche("");
  }

  return (
    <div className="space-y-3">
      <Field label="Ort suchen">
        <div className="flex gap-2">
          <input className="input-base flex-1" value={suche} onChange={e => setSuche(e.target.value)}
            onKeyDown={e => e.key === "Enter" && (e.preventDefault(), geocode())} placeholder="z. B. Ihringen" />
          <button className="btn-primary" onClick={geocode} disabled={loading}>
            {loading ? "…" : "Suchen"}
          </button>
        </div>
      </Field>
      {error && <div className="text-xs text-[#b04545]">{error}</div>}

      {/* Mehrere Treffer zur Auswahl */}
      {treffer.length > 0 && (
        <div className="rounded-sm overflow-hidden" style={{ border: "1px solid #e5e0d4", background: "#fff" }}>
          <div className="px-3 py-2 text-xs uppercase tracking-widest text-[#6b6b6b]" style={{ background: "#fcfaf3", borderBottom: "1px solid #e5e0d4" }}>
            {treffer.length} Treffer – bitte auswählen
          </div>
          {treffer.map((g, i) => {
            const subtitle = [g.admin2, g.admin1, g.country].filter(Boolean).join(" · ");
            return (
              <button key={i} onClick={() => waehle(g)}
                className="w-full text-left px-3 py-2.5 hover:bg-[#f7f4ec] transition-colors"
                style={{ borderBottom: i < treffer.length - 1 ? "1px solid #efece2" : "none" }}>
                <div className="flex items-center justify-between gap-2">
                  <div className="min-w-0">
                    <div className="text-sm font-medium truncate">{g.name}{g.postcodes?.[0] && <span className="text-[#6b6b6b] font-normal"> · {g.postcodes[0]}</span>}</div>
                    <div className="text-xs text-[#6b6b6b] truncate">{subtitle || "—"}</div>
                  </div>
                  <div className="text-[10px] font-mono text-[#9a9a9a] whitespace-nowrap">
                    {g.latitude.toFixed(3)}, {g.longitude.toFixed(3)}
                  </div>
                </div>
              </button>
            );
          })}
        </div>
      )}

      {/* Aktueller Standort */}
      {form.standort_lat != null && (
        <div className="p-3 rounded-sm" style={{ background: "#e8f0e0", border: "1px solid #c9dcc1" }}>
          <div className="flex items-start gap-2">
            <MapPin size={16} style={{ color: "#2d5a3d", marginTop: 2 }} />
            <div className="flex-1 min-w-0">
              <div className="text-sm font-medium">{form.standort_name}</div>
              <div className="text-xs text-[#6b6b6b] font-mono mt-0.5">
                {(+form.standort_lat).toFixed(4)}, {(+form.standort_lng).toFixed(4)}
                {" · "}
                <a href={`https://www.openstreetmap.org/?mlat=${form.standort_lat}&mlon=${form.standort_lng}&zoom=13`}
                   target="_blank" rel="noopener noreferrer"
                   className="underline hover:text-[#2d5a3d]">
                  auf Karte prüfen
                </a>
              </div>
            </div>
            <button onClick={entfernen} className="btn-ghost text-xs px-2 py-1" title="Standort entfernen">
              <X size={12} />
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function Uebersicht({ config, tage, k, berichte, phasen }) {
  if (!k) return null;
  const beratungsModus = config?.modus === "beratung";
  return (
    <div className="py-6 sm:py-8 space-y-6">
      <HeroStatus config={config} k={k} />
      <PhasenStreifen k={k} phasen={phasen} config={config} />
      <PhasenFlow k={k} />
      <TimelineErweitert config={config} k={k} />
      <div className="grid md:grid-cols-3 gap-4">
        <GaugeCard titel="Urlaubs-Budget" verbraucht={k.urlaubGenommen} maximum={k.urlaubGesamt}
          einheit="Tage" farbe="#2e7d5a" subtitel="Gesamt über Ausbildungszeit" icon={Heart} />
        <GaugeCard titel="Fehltage (krank)" verbraucht={k.krank} maximum={k.fehltageSoft}
          einheit="Tage" warnAb={0.6} kritischAb={1.0}
          subtitel={`10 % von ${k.atGes} Ausbildungstagen${k.pauschalFehltage?.summe > 0 ? ` · davon ${k.pauschalFehltage.summe} pauschal aus Phasen` : ""}`}
          icon={AlertTriangle} invertiert />
        <GaugeCard titel="Zeit vergangen" verbraucht={k.kTageVorbei} maximum={k.kTageGes}
          einheit="Tage" farbe="#4a6b3a" subtitel={`${k.dauer} Monate gesamt`} icon={Clock} />
      </div>
      <RisikoRadar k={k} berichte={berichte} />
      <VerguetungsPerioden k={k} config={config} />
      {!beratungsModus && <Heatmap tage={tage} k={k} />}
    </div>
  );
}

function PhasenStreifen({ k, phasen, config }) {
  if (!phasen?.length) {
    return (
      <section className="paper p-5 fade-up">
        <div className="text-xs uppercase tracking-widest text-[#6b6b6b] mb-2">Verlauf</div>
        <p className="text-sm text-[#6b6b6b]">
          Noch keine Phasen angelegt. Lege in den <strong>Einstellungen → Phasen</strong> Vollzeit-,
          Teilzeit- oder Unterbrechungsphasen an, um den Verlauf abzubilden.
        </p>
      </section>
    );
  }
  const phasenMit = k.phasenMit;
  const start = k.start;
  const ende = k.ende;
  const totalMs = ende - start;
  const heute = new Date();
  const heuteAnteil = Math.max(0, Math.min(1, (heute - start) / totalMs));

  // Phase als Bar
  const bars = phasenMit.map(p => {
    const pVon = parseISO(p.von);
    const pBis = parseISO(p.bis || p._berechnetesEnde);
    if (!pBis) return null;
    const left = Math.max(0, (pVon - start) / totalMs) * 100;
    const width = Math.max(0.5, ((pBis - pVon) / totalMs) * 100);
    const isAusb = p.typ === "ausbildung";
    const tz = (p.teilzeit_prozent || 100) / 100;
    const farbe = isAusb ? (tz < 1 ? "#7a9a5a" : "#2d5a3d") : "#9a8a6a";
    return { p, pVon, pBis, left, width, isAusb, tz, farbe };
  }).filter(Boolean);

  return (
    <section className="paper p-5 sm:p-6 fade-up">
      <div className="flex items-center justify-between mb-3">
        <div className="text-xs uppercase tracking-widest text-[#6b6b6b]">Verlauf in Phasen</div>
        {k.aktPhase && (
          <div className="text-xs text-[#6b6b6b]">
            Aktuell: <span className="font-medium" style={{ color: k.aktPhase.typ === "ausbildung" ? "#2d5a3d" : "#9a8a6a" }}>
              {k.aktPhase.typ === "ausbildung" ? `${k.aktPhase.teilzeit_prozent || 100}%${k.aktPhase.betrieb ? ` · ${k.aktPhase.betrieb}` : ""}` : (k.aktPhase.grund || "Unterbrechung")}
            </span>
          </div>
        )}
      </div>

      {/* Horizontale Bars */}
      <div className="relative" style={{ height: 64 }}>
        {/* Hintergrund-Achse */}
        <div className="absolute left-0 right-0 rounded-sm" style={{ top: 12, height: 40, background: "#f0ece0", border: "1px solid #e5e0d4" }} />

        {/* Phasen */}
        {bars.map((b, i) => {
          const tzHeight = b.isAusb ? 28 + 12 * b.tz : 28;
          return (
            <div key={i} className="absolute group cursor-default" title={`${b.p.typ === "ausbildung" ? `${b.p.teilzeit_prozent || 100}%` : (b.p.grund || "Unterbrechung")} · ${fmtDE(b.pVon)} – ${fmtDE(b.pBis)}`}
                 style={{
                   left: `${b.left}%`, width: `${b.width}%`,
                   top: 12 + (40 - tzHeight),
                   height: tzHeight,
                   background: b.isAusb ? b.farbe : `repeating-linear-gradient(45deg, ${b.farbe}, ${b.farbe} 4px, ${b.farbe}aa 4px, ${b.farbe}aa 8px)`,
                   borderTop: `1px solid ${b.farbe}`,
                   borderBottom: `1px solid ${b.farbe}`,
                 }}>
              {b.width > 5 && b.isAusb && b.p.teilzeit_prozent < 100 && (
                <div className="absolute inset-0 flex items-center justify-center text-[9px] font-mono font-medium" style={{ color: "#fff" }}>
                  {b.p.teilzeit_prozent}%
                </div>
              )}
            </div>
          );
        })}

        {/* Betriebs-Wechsel-Marker */}
        {bars.map((b, i) => {
          if (i === 0) return null;
          const prev = bars[i - 1];
          if (!b.isAusb || !prev.isAusb) return null;
          if ((b.p.betrieb || null) === (prev.p.betrieb || null)) return null;
          return (
            <div key={`bw-${i}`} className="absolute" title={`Betriebswechsel zu ${b.p.betrieb || "—"}`}
              style={{ left: `${b.left}%`, top: 0, height: 64, transform: "translateX(-50%)" }}>
              <div className="w-0.5 h-full" style={{ background: "#c9a23a" }} />
              <div className="absolute -top-1 left-1/2 -translate-x-1/2 text-[10px]" style={{ color: "#c9a23a" }}>🏢</div>
            </div>
          );
        })}

        {/* Heute-Marker */}
        {heute >= start && heute <= ende && (
          <div className="absolute" style={{ left: `${heuteAnteil * 100}%`, top: 0, height: 64 }}>
            <div className="w-0.5 h-full" style={{ background: "#b04545" }} />
            <div className="absolute -top-1 left-1/2 -translate-x-1/2 text-[10px] font-medium" style={{ color: "#b04545" }}>heute</div>
          </div>
        )}
      </div>

      {/* Achsen-Labels */}
      <div className="flex justify-between text-[10px] text-[#6b6b6b] font-mono mt-1">
        <span>{fmtDE(start)}</span>
        <span>{fmtDE(ende)}</span>
      </div>

      {/* Legende */}
      <div className="flex flex-wrap gap-3 mt-4 pt-3 border-t text-xs" style={{ borderColor: "#efece2" }}>
        <div className="flex items-center gap-1.5">
          <div className="w-3 h-3 rounded-sm" style={{ background: "#2d5a3d" }} />
          <span className="text-[#6b6b6b]">Vollzeit</span>
        </div>
        <div className="flex items-center gap-1.5">
          <div className="w-3 h-3 rounded-sm" style={{ background: "#7a9a5a" }} />
          <span className="text-[#6b6b6b]">Teilzeit</span>
        </div>
        <div className="flex items-center gap-1.5">
          <div className="w-3 h-3 rounded-sm" style={{ background: "repeating-linear-gradient(45deg, #9a8a6a, #9a8a6a 3px, #d0c8b0 3px, #d0c8b0 5px)" }} />
          <span className="text-[#6b6b6b]">Unterbrechung</span>
        </div>
        <div className="flex items-center gap-1.5">
          <span style={{ color: "#c9a23a" }}>🏢</span>
          <span className="text-[#6b6b6b]">Betriebswechsel</span>
        </div>
      </div>
    </section>
  );
}

          <div className="flex items-center gap-2 mt-3 text-xs text-[#6b6b6b]">
            <Zap size={13} style={{ color: "#2d5a3d" }} />

              <div className="flex items-baseline gap-2 mt-1">

                <div className="text-sm text-[#6b6b6b]">Tage</div>

              <div className="text-xs text-[#6b6b6b] mt-1 font-mono">ca. {fmtDE(ym.datum)}</div>

function PhasenFlow({ k }) {
  return (
    <section className="paper p-6 sm:p-8 fade-up" style={{ animationDelay: "0.1s" }}>
      <h2 className="font-display text-xl mb-5" style={{ fontWeight: 600 }}>Ausbildungs-Phasen</h2>
      <div className="grid md:grid-cols-3 gap-3 md:gap-4">
        {LEHRJAHR_PHASEN.map((phase, i) => {
          const Ic = phase.icon;
          const aktiv = k.aktLehrjahr === i + 1;
          const vorbei = k.aktLehrjahr > i + 1;
          const zukunft = k.aktLehrjahr < i + 1;
          return (
            <div key={i} className="bg-white rounded-sm p-4" style={{
              border: aktiv ? "2px solid #2d5a3d" : "1px solid #e5e0d4",
              boxShadow: aktiv ? "0 4px 16px -6px rgba(45,90,61,0.2)" : "none",
              opacity: zukunft ? 0.65 : 1,
            }}>
              <div className="flex items-start gap-3 mb-3">
                <div className="p-2 rounded-sm flex-shrink-0" style={{
                  background: vorbei || aktiv ? "#2d5a3d" : "#f0ece0",
                  color: vorbei || aktiv ? "#fff" : "#6b6b6b",
                }}>
                  {vorbei ? <CheckCircle2 size={18} /> : <Ic size={18} />}
                </div>
                <div>
                  <div className="text-xs uppercase tracking-widest text-[#6b6b6b]">{phase.titel}</div>
                  <div className="font-display text-base" style={{ fontWeight: 600 }}>{phase.fokus}</div>
                </div>
              </div>
              <ul className="space-y-1 text-xs text-[#4a4a4a]">
                {phase.inhalte.map((x, j) => (
                  <li key={j} className="flex items-start gap-1.5">
                    <span className="mt-1.5 w-1 h-1 rounded-full flex-shrink-0" style={{ background: aktiv || vorbei ? "#2d5a3d" : "#c0b8a8" }} />
                    <span>{x}</span>
                  </li>
                ))}
              </ul>
              {aktiv && (
                <div className="mt-3 pt-3 border-t flex items-center gap-1.5 text-xs" style={{ borderColor: "#e5e0d4", color: "#2d5a3d" }}>
                  <Activity size={12} /> <span>Aktuelles Lehrjahr</span>
                </div>
              )}
            </div>
          );
        })}
      </div>
